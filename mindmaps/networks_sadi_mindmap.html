<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Networks: Core Concepts & Disambiguation</title>
<style>
  :root {
    --bg-color: #121314;
    --canvas-bg: #121314;
    --grid-minor: rgba(255, 255, 255, 0.04);
    --grid-major: rgba(255, 255, 255, 0.09);
    --panel-bg: #1a1b1d;
    --panel-border: #555555;
    --text-primary: #f0f0ea;
    --text-secondary: #b0b0a8;
    --text-muted: #808078;
    --node-bg: #1a1b1d;
    --node-border: #555555;
    --link-color: rgba(160, 160, 160, 0.35);
    --link-pulse: #f0f0ea;
    --drawer-bg: #1a1b1d;
    --table-head-bg: #242528;
    --table-border: #555555;
    --table-stripe: #1e1f22;
    --btn-bg: #1e1f22;
    --btn-hover: #2a2b2f;
    --icon-color: #b0b0a8;
    --icon-hover: #f0f0ea;
    --font-serif: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", "Courier New", Courier, monospace;
  }

  body.light-theme {
    --bg-color: #f5f5f0;
    --canvas-bg: #f5f5f0;
    --grid-minor: rgba(0, 0, 0, 0.04);
    --grid-major: rgba(0, 0, 0, 0.09);
    --panel-bg: #ffffff;
    --panel-border: #111111;
    --text-primary: #111111;
    --text-secondary: #444444;
    --text-muted: #666666;
    --node-bg: #ffffff;
    --node-border: #111111;
    --link-color: rgba(60, 60, 60, 0.35);
    --link-pulse: #111111;
    --drawer-bg: #ffffff;
    --table-head-bg: #f5f5f0;
    --table-border: #111111;
    --table-stripe: #fafaf8;
    --btn-bg: #f9f9f6;
    --btn-hover: #eaeae4;
    --icon-color: #444444;
    --icon-hover: #111111;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0 !important;
  }

  ::selection {
    background: var(--text-primary);
    color: var(--panel-bg);
  }
  ::-moz-selection {
    background: var(--text-primary);
    color: var(--panel-bg);
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: var(--font-serif);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  #canvas-container {
    flex: 1;
    height: 100%;
    position: relative;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  #canvas-container:active { cursor: grabbing; }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Minimalist Graph Paper Grid */
  .grid-bg {
    transition: opacity 0.2s ease;
  }
  .grid-bg.hidden { opacity: 0; }

  /* Moving Organic Links */
  .link-path {
    fill: none;
    stroke: var(--link-color);
    stroke-width: 1.5px;
    stroke-linecap: square;
    transition: stroke 0.2s ease, stroke-width 0.2s ease;
  }
  .link-path.highlighted {
    stroke-width: 2.5px;
    stroke: var(--text-primary);
  }

  /* Draggable Node Pills / Wireframe Rectangles */
  .node-group {
    cursor: grab;
    transition: filter 0.15s ease;
    user-select: none;
    -webkit-user-select: none;
  }
  .node-group:active { cursor: grabbing; }

  .node-capsule {
    rx: 0px !important;
    ry: 0px !important;
    stroke-width: 1.5px;
    transition: stroke 0.2s ease, stroke-width 0.2s ease, filter 0.2s ease;
  }
  .node-capsule:hover {
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
  }
  body:not(.light-theme) .node-capsule:hover {
    filter: drop-shadow(0 4px 10px rgba(255, 255, 255, 0.25));
  }
  .node-capsule.selected {
    stroke-width: 2.5px !important;
    stroke: var(--text-primary) !important;
    filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.4)) !important;
  }
  body:not(.light-theme) .node-capsule.selected {
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4)) !important;
  }
  .node-capsule.matched {
    stroke: var(--text-primary) !important;
    stroke-width: 3px !important;
    stroke-dasharray: 4 2;
  }

  .node-label {
    font-size: 13px;
    font-weight: 500;
    fill: var(--text-primary);
    font-family: var(--font-serif);
    pointer-events: none;
    letter-spacing: 0.1px;
  }
  .node-label.root-label {
    font-size: 14.5px;
    font-weight: 700;
    font-style: italic;
    fill: var(--text-primary);
  }
  .node-label.domain-label {
    font-size: 13.5px;
    font-weight: 600;
  }

  .status-dot {
    pointer-events: none;
  }

  .badge-count {
    font-size: 11px;
    font-weight: 700;
    fill: #ffffff;
    font-family: var(--font-mono);
    pointer-events: none;
  }

  /* Minimalist Floating Toolbar with Pure Monochrome Icons */
  .toolbar {
    position: absolute;
    top: 16px;
    left: 20px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 2px 2px 0px var(--panel-border);
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 10px;
    border-right: 1px solid var(--panel-border);
    font-size: 13.5px;
    font-weight: 700;
    font-family: var(--font-serif);
    color: var(--text-primary);
    user-select: none;
    -webkit-user-select: none;
  }
  .live-dot {
    width: 7.5px;
    height: 7.5px;
    background: var(--text-primary);
    border-radius: 0 !important;
  }

  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap input {
    background: var(--btn-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-primary);
    font-family: var(--font-serif);
    border-radius: 0 !important;
    padding: 5px 10px 5px 28px;
    font-size: 12.5px;
    width: 190px;
    outline: none !important;
    transition: all 0.15s ease;
  }
  .search-wrap input:focus {
    width: 240px;
    border-color: var(--text-primary);
    background: var(--panel-bg);
  }
  .search-ico {
    position: absolute;
    left: 9px;
    display: flex;
    align-items: center;
    color: var(--icon-color);
    pointer-events: none;
  }

  .search-badge {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--panel-bg);
    background: var(--text-primary);
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    padding: 2px 7px;
    display: none;
    white-space: nowrap;
  }

  /* Monochrome Icon Buttons (No text!) */
  .mono-btn {
    background: var(--btn-bg);
    border: 1px solid var(--panel-border);
    color: var(--icon-color);
    border-radius: 0 !important;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s ease;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    outline: none !important;
  }
  .mono-btn svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    display: block;
  }
  .mono-btn:hover {
    background: var(--text-primary);
    color: var(--panel-bg);
    border-color: var(--text-primary);
  }
  .mono-btn.active {
    background: var(--text-primary) !important;
    color: var(--panel-bg) !important;
    border-color: var(--text-primary) !important;
  }

  /* Backdrop Overlay when Details Drawer is Open */
  .drawer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.48);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .drawer-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  body.light-theme .drawer-overlay {
    background: rgba(0, 0, 0, 0.25);
  }

  /* Sleek Slide-over Details Drawer */
  .details-drawer {
    width: 500px;
    max-width: 92vw;
    height: 100%;
    background: var(--drawer-bg);
    border-left: 2px solid var(--panel-border);
    border-radius: 0 !important;
    box-shadow: -10px 0 30px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 20;
    position: absolute;
    right: 0;
    top: 0;
  }
  .details-drawer.open {
    transform: translateX(0);
  }

  .drawer-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .drawer-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 0 !important;
    border: 1px solid var(--panel-border);
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-mono);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .drawer-title {
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-serif);
    line-height: 1.35;
    color: var(--text-primary);
  }

  .drawer-bar {
    padding: 8px 20px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    gap: 8px;
    background: var(--btn-bg);
  }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 22px;
    font-size: 14px;
    line-height: 1.65;
    font-family: var(--font-serif);
    color: var(--text-secondary);
  }
  .drawer-body h3 {
    color: var(--text-primary);
    margin: 16px 0 8px 0;
    font-size: 15px;
    font-weight: 700;
    font-family: var(--font-serif);
  }
  .drawer-body p { margin-bottom: 12px; }
  .drawer-body ul, .drawer-body ol { padding-left: 22px; margin-bottom: 12px; }
  .drawer-body li { margin-bottom: 6px; }
  .drawer-body strong { color: var(--text-primary); font-family: var(--font-serif); }
  .drawer-body em { font-style: italic; }
  .drawer-body code {
    background: var(--btn-bg);
    color: var(--text-primary);
    padding: 2px 6px;
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    font-family: var(--font-mono);
    font-size: 12px;
  }

  /* Clean Academic Tables */
  .drawer-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0 18px 0;
    font-size: 13px;
    border-radius: 0 !important;
    overflow: hidden;
    font-family: var(--font-serif);
    border: 1px solid var(--table-border);
  }
  .drawer-body th, .drawer-body td {
    padding: 8px 11px;
    border: 1px solid var(--table-border);
    text-align: left;
    vertical-align: top;
  }
  .drawer-body th {
    background: var(--table-head-bg);
    color: var(--text-primary);
    font-weight: 700;
  }
  .drawer-body tr:nth-child(even) { background: var(--table-stripe); }

  /* Concept Pills */
  .concept-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 10px 0 16px 0;
  }
  .concept-pill {
    background: var(--btn-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-secondary);
    font-family: var(--font-serif);
    border-radius: 0 !important;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.1s ease;
  }
  .concept-pill:hover {
    background: var(--text-primary);
    color: var(--panel-bg);
    border-color: var(--text-primary);
  }

  /* Minimalist Footer Hint */
  .hint-pill {
    position: absolute;
    bottom: 16px;
    left: 20px;
    font-size: 12px;
    font-family: var(--font-serif);
    color: var(--text-muted);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    padding: 4px 12px;
    pointer-events: none;
    box-shadow: 2px 2px 0px var(--panel-border);
  }

  /* Robust Drawer Theme Adaptations */
  body.light-theme .drawer-body div[style*="background"] {
    background: var(--btn-bg) !important;
    border-color: var(--panel-border) !important;
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body span[style*="color:#38bdf8"],
  body.light-theme .drawer-body p[style*="color:#38bdf8"],
  body.light-theme .drawer-body a[style*="color:#38bdf8"] {
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body p[style*="color:#cbd5e1"],
  body.light-theme .drawer-body ul[style*="color:#94a3b8"] {
    color: var(--text-secondary) !important;
  }
  body.light-theme .drawer-body tr[style*="background:#1e293b"] {
    background: var(--table-head-bg) !important;
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body tr[style*="background:#1e293b"] th {
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body tr[style*="background:#0f172a"] {
    background: var(--table-stripe) !important;
  }
  body.light-theme .drawer-body a[style*="background"] {
    background: var(--text-primary) !important;
    color: var(--panel-bg) !important;
    border: 1px solid var(--panel-border) !important;
  }

  /* Retro Monochrome Emojis */
  .mono-emoji {
    display: inline-block;
    vertical-align: -0.1em;
    line-height: 1;
    filter: grayscale(100%) brightness(0.65) contrast(160%);
    -webkit-filter: grayscale(100%) brightness(0.65) contrast(160%);
    transition: filter 0.1s ease;
  }
  body:not(.light-theme) .mono-emoji {
    filter: grayscale(100%) brightness(1.75) contrast(140%);
    -webkit-filter: grayscale(100%) brightness(1.75) contrast(140%);
  }
  body.light-theme .drawer-body a[style*="background"] .mono-emoji,
  body.light-theme .btn:hover .mono-emoji,
  body.light-theme button:hover .mono-emoji {
    filter: grayscale(100%) brightness(2.2) contrast(150%) !important;
    -webkit-filter: grayscale(100%) brightness(2.2) contrast(150%) !important;
  }
</style>
</head>
<body>

<div id="canvas-container">
  <div class="toolbar">
    <div class="brand">
      <div class="live-dot"></div>
      <span>Computer Networks: Core Concepts & Disambiguation</span>
    </div>

    <div class="search-wrap">
      <span class="search-ico">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input type="text" id="search-input" placeholder="Search concepts (Tahoe, Karn, AIMD)...">
    </div>
    <span class="search-badge" id="search-badge">0</span>

    <!-- Search Prev/Next (Monochrome Icons) -->
    <button class="mono-btn" id="search-prev" style="display:none;" title="Previous Match">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <button class="mono-btn" id="search-next" style="display:none;" title="Next Match">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>

    <!-- Theme Switcher (Monochrome Sun/Moon Icon) -->
    <button class="mono-btn" id="btn-theme" title="Toggle Light / Dark Mode">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>

    <!-- Grid Toggle (Monochrome Grid Icon) -->
    <button class="mono-btn active" id="btn-grid" title="Toggle Graph Paper Grid">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
    </button>

    <!-- Reset Layout (Monochrome Reset Icon) -->
    <button class="mono-btn" id="btn-reset" title="Reset Layout to Default Radial Grid">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
    </button>

    <!-- Fit View (Monochrome Crosshairs / Fit Icon) -->
    <button class="mono-btn" id="btn-fit" title="Zoom to Fit">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><polyline points="21 15 21 21 15 21"></polyline><polyline points="3 9 3 3 9 3"></polyline></svg>
    </button>

    <!-- Expand All (Monochrome Tree Expand Icon) -->
    <button class="mono-btn" id="btn-expand" title="Expand All Branches">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
    </button>

    <!-- Collapse All (Monochrome Tree Fold Icon) -->
    <button class="mono-btn" id="btn-collapse" title="Collapse to Domains">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
    </button>
  </div>

  <svg id="svg-canvas">
    <defs>
      <!-- Engineering Graph Paper Grid -->
      <pattern id="grid-pattern-minor" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--grid-minor)" stroke-width="0.75" />
      </pattern>
      <pattern id="grid-pattern-major" width="120" height="120" patternUnits="userSpaceOnUse">
        <rect width="120" height="120" fill="url(#grid-pattern-minor)" />
        <path d="M 120 0 L 0 0 0 120" fill="none" stroke="var(--grid-major)" stroke-width="1.2" />
      </pattern>
    </defs>

    <g id="viewport">
      <!-- Infinite Graph Paper Grid Plane -->
      <rect id="grid-plane" class="grid-bg" x="-10000" y="-10000" width="20000" height="20000" fill="url(#grid-pattern-major)" />

      <!-- Moving Links Layer -->
      <g id="links-layer"></g>

      <!-- Movable Nodes Layer -->
      <g id="nodes-layer"></g>
    </g>
  </svg>

  <div class="hint-pill">
    Drag nodes to reposition • Scroll to zoom • Click +/- to toggle branch • Click node for details
  </div>
</div>

<!-- Backdrop Overlay for Details Drawer -->
<div class="drawer-overlay" id="drawer-overlay"></div>

<div class="details-drawer" id="details-drawer">
  <div class="drawer-head">
    <div style="display: flex; align-items: flex-start; gap: 10px; flex: 1;">
      <!-- Monochrome Back Button -->
      <button class="mono-btn" id="drawer-back" title="Go Back to Previous Concept" disabled style="margin-top: 2px; flex-shrink: 0; opacity: 0.35; cursor: not-allowed; pointer-events: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <div style="flex: 1; min-width: 0;">
        <div class="drawer-badge" id="drawer-badge">Overview</div>
        <div class="drawer-title" id="drawer-title">Node Title</div>
      </div>
    </div>
    <!-- Monochrome Close Button -->
    <button class="mono-btn" id="drawer-close" title="Close Panel" style="flex-shrink: 0;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  <div class="drawer-bar">
    <!-- Monochrome Back Button in Action Bar -->
    <button class="mono-btn" id="bar-btn-back" title="Go Back to Previous Concept" disabled style="opacity: 0.35; cursor: not-allowed; pointer-events: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <!-- Monochrome Center/Focus Button -->
    <button class="mono-btn" id="bar-btn-focus" title="Center in View">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line></svg>

\"width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                      <tr style=\"background:#1e293b; color:#38bdf8;\">\n                        <th style=\"padding:6px; border:1px solid #334155;\">Protocol</th>\n                        <th style=\"padding:6px; border:1px solid #334155;\">Demultiplexing Key</th>\n                        <th style=\"padding:6px; border:1px solid #334155;\">Socket Mapping Behavior</th>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>UDP (Connectionless)</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>2-Tuple:</strong> <code>(Dest IP, Dest Port)</code></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\">Two UDP packets arriving from different source IPs or source ports with the same destination port are delivered to the <strong>exact same socket</strong>.</td>\n                      </tr>\n                      <tr style=\"background:#0f172a;\">\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>TCP (Connection-Oriented)</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>4-Tuple:</strong> <code>(Src IP, Src Port, Dest IP, Dest Port)</code></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\">Each unique client connection is directed to a <strong>separate dedicated socket</strong> spawned by the server (accept loop), even though all initial handshakes arrive at port 80/443.</td>\n                      </tr>\n                    </table>\n                    <p style=\"margin-top:8px;\"><strong>Port Number Space (16 bits):</strong> Well-Known (0–1023), Registered (1024–49151), Ephemeral/Private (49152–65535).</p>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#3b82f6; color:#000;\">MEDIUM PRIORITY · 15x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 15 subquestions across 9 exam sessions (2020, 2021, 2022, 2023).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>What is Ethernet? Describe the working principle of Ethernet's CSMA/CD protocol with a detail look o</em></li><li><em>How does Multiple Access with Collision Avoidance (MACA) solve hidden terminal problem in wireless n</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=Ethernet\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            ", "children": [{"name": "UDP 2-Tuple: (Dest IP, Dest Port)", "details": "Shared socket for all senders targeting the destination port. Source IP/port are read inside the message payload."}, {"name": "TCP 4-Tuple: (Src IP, Src Port, Dest IP, Dest Port)", "details": "Unique dedicated socket per active connection. Server accept() forks or binds a separate socket structure."}, {"name": "Port Classification (16-bit space)", "details": "Well-known (0-1023), Registered (1024-49151), Dynamic/Ephemeral (49152-65535)."}]}]}, {"name": "3. Reliable Data Transfer (RDT) Theory & Pipelining", "domain_id": 3, "details": "\n            <h3>Reliable Data Transfer (RDT) State Machines</h3>\n            <p>RDT models the progressive construction of reliability over channels that exhibit bit corruption, duplicate packet delivery, packet reordering, and complete packet loss.</p>\n            \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 29x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 29 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>What should be the relation between window sizes and sequence number in case of Selective Repeat? Wh</em></li><li><em>Consider the data bits D=11011011 and Generator G = 10110. Calculate the Cyclic Redundancy Check bit</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=Reliable\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            ", "children": [{"name": "3.1 RDT Protocol Evolution (1.0 -> 3.0)", "details": "\n                    <h3>Step-by-Step RDT State Machine Progression</h3>\n                    <ul>\n                      <li><strong>rdt 1.0:</strong> Completely reliable underlying channel. No bit errors, no losses. Trivial sender/receiver state machines.</li>\n                      <li><strong>rdt 2.0:</strong> Channel with bit corruption. Introduces <strong>Checksum</strong>, <strong>ACK</strong> (positive feedback), and <strong>NAK</strong> (negative feedback).\n                        <br><span style=\"color:#f87171;\">Fatal Flaw:</span> If the ACK/NAK packet itself gets corrupted, sender cannot know what receiver said!</li>\n                      <li><strong>rdt 2.1:</strong> Solves corrupted feedback by introducing a <strong>1-bit Sequence Number</strong> (0 and 1) in data packets. If ACK/NAK is corrupted, sender retransmits. Receiver detects duplicate sequence number, discards duplicate data, and re-ACKs.</li>\n                      <li><strong>rdt 2.2:</strong> <strong>NAK-Free Protocol.</strong> Replaces NAKs with duplicate ACKs. Receiver ACKs the last correctly received packet sequence number. An ACK for the previous packet serves as an implicit NAK for the current packet.</li>\n                      <li><strong>rdt 3.0:</strong> Channel with bit errors AND packet loss. Introduces a <strong>Countdown Timer</strong>. Sender retransmits packet on timer expiration. Handles packet loss, lost ACKs, and premature timeouts.</li>\n                    </ul>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 29x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 29 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>What should be the relation between window sizes and sequence number in case of Selective Repeat? Wh</em></li><li><em>Consider the data bits D=11011011 and Generator G = 10110. Calculate the Cyclic Redundancy Check bit</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=Reliable\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            ", "children": [{"name": "rdt 1.0: Flawless Channel", "details": "Assumes underlying channel has zero packet loss and zero bit corruption. No ACKs, no timers."}, {"name": "rdt 2.0: Checksum & Fatal Feedback Flaw", "details": "Introduces Checksums and ACK/NAK. Fatal flaw: sender cannot interpret a corrupted ACK/NAK packet."}, {"name": "rdt 2.1: 1-Bit Sequence Number", "details": "Adds 1-bit sequence number (0 or 1). Sender retransmits on corrupted ACK; receiver discards duplicates."}, {"name": "rdt 2.2: NAK-Free Protocol", "details": "Eliminates NAKs entirely by sending duplicate ACKs for the last good packet."}, {"name": "rdt 3.0: Countdown Timer for Packet Loss", "details": "Adds countdown retransmission timer to recover from dropped packets, dropped ACKs, and network delay.\n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 19x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 19 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>List down the steps involved in SSL handshaking. Also present apictorial view of packet transmission</em></li><li><em>Briefly explain how Secure Socket Layer (SSL) works on top of TCP and what services it provides.</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=TLS\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            "}]}, {"name": "3.2 Stop-and-Wait vs Pipelined Protocols", "details": "\n                    <h3>Disambiguation: Stop-and-Wait vs Pipelined Utilization</h3>\n                    <p><strong>Stop-and-Wait Efficiency Formula:</strong></p>\n                    $$U_{\\text{sender}} = \\frac{L/R}{\\text{RTT} + L/R}$$\n                    <p><em>Example:</em> 1 Gbps link ($R = 10^9\\text{ bps}$), 30 ms RTT ($0.03\\text{ s}$), 1 KB packet ($L = 8000\\text{ bits}$).</p>\n                    <p>Transmission delay $t_{\\text{trans}} = 8000 / 10^9 = 8\\,\\mu\\text{s}$.</p>\n                    $$U_{\\text{sender}} = \\frac{0.000008}{0.03 + 0.000008} \\approx 0.00027 \\quad (0.027\\%!)$$\n                    <p>The link is idle 99.97% of the time! Pipelining solves this by allowing $N$ in-flight packets:</p>\n                    $$U_{\\text{pipelined}} = \\frac{N \\times (L/R)}{\\text{RTT} + L/R}$$\n                    <p>Choosing $N = \\lceil (\\text{RTT} \\times R) / L \\rceil$ yields 100% link utilization.</p>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#3b82f6; color:#000;\">MEDIUM PRIORITY · 16x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 16 subquestions across 9 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>Suppose a source and a destination are connected through a switch and a router. Ifthe source sends a</em></li><li><em>What are the differences between IP based forwarding and generalized forwarding? (10)  Explain simpl</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=Network\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            ", "children": [{"name": "Stop-and-Wait: <0.1% Link Utilization", "details": "Sender must wait a full RTT for ACK before sending next segment, leaving link idle 99.9% of the time."}, {"name": "Pipelined Utilization: N * (L/R) / RTT", "details": "Keeps the pipeline full with N in-flight unacknowledged packets. 100% utilization when N >= Bandwidth-Delay Product.\n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#3b82f6; color:#000;\">MEDIUM PRIORITY · 13x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 13 subquestions across 6 exam sessions (2017, 2019, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>An organization's network is connected to the internet through a 25 Mbps access link. (12)  Users re</em></li><li><em>Consider the following figure where Mr. X wants to access a webpage hosted on a (15) (C021 Google se</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=Network\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            "}]}, {"name": "3.3 Go-Back-N (GBN) vs Selective Repeat (SR)", "details": "\n                    <h3>Deep Disambiguation: Go-Back-N vs Selective Repeat</h3>\n                    <table style=\"width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                      <tr style=\"background:#1e293b; color:#38bdf8;\">\n                        <th style=\"padding:6px; border:1px solid #334155;\">Dimension</th>\n                        <th style=\"padding:6px; border:1px solid #334155;\">Go-Back-N (GBN)</th>\n                        <th style=\"padding:6px; border:1px solid #334155;\">Selective Repeat (SR)</th>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Acknowledgment Type</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Cumulative ACK:</strong> <code>ACK(n)</code> acknowledges all packets up to and including $n$.</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Individual ACK:</strong> <code>ACK(n)</code> acknowledges only packet $n$.</td>\n                      </tr>\n                      <tr style=\"background:#0f172a;\">\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Sender Timers</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Single timer</strong> for the oldest unacknowledged packet (<code>base</code>).</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Independent timer</strong> for each unacknowledged packet.</td>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Receiver Buffering</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>No buffering.</strong> Out-of-order packets are discarded immediately. Re-ACKs highest in-order packet.</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Buffers out-of-order packets</strong> until missing gaps are filled, then delivers batch to application.</td>\n                      </tr>\n                      <tr style=\"background:#0f172a;\">\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Retransmission Cost</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\">Retransmits <strong>ALL $N$ packets</strong> in window on timeout (wasteful over lossy links).</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\">Retransmits <strong>only the specific lost packet</strong>.</td>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Window Size Constraint</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\">$N \\le 2^k - 1$</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>$N \\le 2^{k-1}$</strong> (Window size cannot exceed half sequence space to prevent ambiguity between old duplicates and new packets).</td>\n                      </tr>\n                    </table>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#3b82f6; color:#000;\">WATCHLIST · 7x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 7 subquestions across 6 exam sessions (2019, 2021, 2022, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>In TCP, EstimatedRTT, DevRTT and Timeoutlnterval adapt to changing network (14)  conditions. Suppose</em></li><li><em>In the following figure, some desired packet transfer is shown. Introduce a retransmission (12) time</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=TCP\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            ", "children": [{"name": "GBN: Cumulative ACK & 1 Timer", "details": "Receiver discards all out-of-order packets. Single timer for base. Retransmits entire win x; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            "}]}, {"name": "4.2 Three-Way Handshake & SYN Floods", "details": "\n                    <h3>Connection Establishment & Attack Vector Disambiguation</h3>\n                    <p><strong>Three-Way Handshake:</strong></p>\n                    <ol>\n                      <li><strong>Client -> Server:</strong> <code>SYN=1, seq=client_isn</code> (No data payload).</li>\n                      <li><strong>Server -> Client:</strong> <code>SYN=1, ACK=1, seq=server_isn, ack=client_isn + 1</code>. Server allocates TCB (Transmission Control Block) and buffers.</li>\n                      <li><strong>Client -> Server:</strong> <code>ACK=1, seq=client_isn + 1, ack=server_isn + 1</code>. May carry first application data bytes!</li>\n                    </ol>\n                    <p><strong>SYN Flood Attack vs SYN Cookies Defense:</strong></p>\n                    <ul>\n                      <li><strong>SYN Flood:</strong> Attacker transmits flood of SYNs with spoofed source IPs and never completes Step 3. Server connection queue fills with half-open connections, refusing legitimate users.</li>\n                      <li><strong>SYN Cookies (Defense):</strong> Server <em>allocates zero memory</em> on receiving SYN. It crafts <code>server_isn</code> using a cryptographic hash:\n                        $$server\\_isn = \\text{Hash}(src\\_ip, src\\_port, dst\\_ip, dst\\_port, \\text{secret}) + \\text{timestamp}$$\n                        When legitimate client sends ACK with <code>ack = server_isn + 1</code>, server verifies hash and only then allocates socket memory!</li>\n                    </ul>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 29x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 29 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>What should be the relation between window sizes and sequence number in case of Selective Repeat? Wh</em></li><li><em>Consider the data bits D=11011011 and Generator G = 10110. Calculate the Cyclic Redundancy Check bit</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=Reliable\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            ", "children": [{"name": "3-Way Handshake Sequence", "details": "Client SYN -> Server SYN-ACK (allocates state) -> Client ACK (completes connection)."}, {"name": "SYN Flood Attack", "details": "Spoofed SYNs overwhelm server's half-open connection table, denying service to legitimate clients."}, {"name": "SYN Cookies Defense", "details": "Server allocates zero state upon SYN, encoding state into ISN hash; verifies upon final ACK.\n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 24x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 24 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>Differentiatc GET and conditional GET commands of HTTP- How does conditional GET command improve per</em></li><li><em>While searching for new pair of shoes, you Visited multiple e-commerce sites and may (10)  or may no</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=HTTP,\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            "}]}, {"name": "4.3 Connection Teardown & TIME_WAIT (2MSL)", "details": "\n                    <h3>Connection Teardown & Why TIME_WAIT is Essential</h3>\n                    <p>TCP is full-duplex, so each direction must be closed independently:</p>\n                    <ol>\n                      <li>Client sends <code>FIN=1, seq=u</code> -> Enters <code>FIN_WAIT_1</code>.</li>\n                      <li>Server sends <code>ACK=1, ack=u+1</code> -> Client enters <code>FIN_WAIT_2</code>. Server enters <code>CLOSE_WAIT</code> (server can still send remaining data).</li>\n                      <li>Server finishes data, sends <code>FIN=1, seq=w</code> -> Server enters <code>LAST_ACK</code>.</li>\n                      <li>Client sends <code>ACK=1, ack=w+1</code> -> Client enters <strong>TIME_WAIT</strong> for $2 \\times \\text{MSL}$. Server receives ACK and enters <code>CLOSED</code>.</li>\n                    </ol>\n                    <p><strong>Why is TIME_WAIT Necessary? (Two Reasons):</strong></p>\n                    <ul>\n                      <li><strong>Reason 1 (Reliable Termination):</strong> If Client's final ACK is lost, Server retransmits FIN. If Client had already closed immediately, it would respond with <code>RST</code>, causing an error on Server rather than a clean close.</li>\n                      <li><strong>Reason 2 (Old Packet Drain):</strong> Prevents old wandering duplicate segments from a prior connection incarnation from being mistakenly delivered to a new connection reusing the same 4-tuple. MSL is Maximum Segment Lifetime (typically 30–60s; $2\\text{MSL} = 1\\text{–}2\\text{ min}$).</li>\n                    </ul>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; s <code>rwnd = 0</code>, sender stops transmitting. Later, receiver's app reads data and receiver sends an ACK with <code>rwnd > 0</code>. <em>If this ACK is lost, both sides wait forever (Deadlock)!</em></li>\n                      <li><strong>Persistence Timer Solution:</strong> When <code>rwnd = 0</code>, sender starts a Persistence Timer. On expiry, sender sends a <strong>1-byte Probe Segment</strong>. The receiver must ACK this probe, re-advertising the current <code>rwnd</code> and breaking the deadlock.</li>\n                    </ul>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 29x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 29 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>What should be the relation between window sizes and sequence number in case of Selective Repeat? Wh</em></li><li><em>Consider the data bits D=11011011 and Generator G = 10110. Calculate the Cyclic Redundancy Check bit</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=Reliable\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10p        <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            "}, {"name": "Zero-Window Probes & Persistence Timer", "details": "1-byte probe segment sent periodically when rwnd=0 to prevent deadlock from lost window update ACKs."}]}, {"name": "5.2 Silly Window Syndrome: Nagle vs Clark", "details": "\n                    <h3>Disambiguation: Sender-Side vs Receiver-Side Silly Window Syndrome</h3>\n                    <p><strong>The Pathology:</strong> Tiny packets (e.g. 1-byte data + 40-byte TCP/IP header = 41-byte packet with 2.4% efficiency!) flood the network.</p>\n                    <table style=\"width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                      <tr style=\"background:#1e293b; color:#38bdf8;\">\n                        <th style=\"padding:6px; border:1px solid #334155;\">Entity</th>\n                        <th style=\"padding:6px; border:1px solid #334155;\">Problem Cause</th>\n                        <th style=\"padding:6px; border:1px solid #334155;\">RFC Solution</th>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Sender Side</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\">Application generates data 1 byte at a time (e.g. Telnet keystrokes) and immediately transmits.</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Nagle's Algorithm (RFC 896):</strong> If data $\\ge \\text{MSS}$, send immediately. Otherwise, send only if all previous packets have been acknowledged. While waiting for ACK, buffer incoming bytes.</td>\n                      </tr>\n                      <tr style=\"background:#0f172a;\">\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Receiver Side</strong></td>\n                        <td style=\"padding:6p idth:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                      <tr style=\"background:#1e293b; color:#38bdf8;\">\n                        <th style=\"padding:6px; border:1px solid #334155;\">Algorithm</th>\n                        <th style=\"padding:6px; border:1px solid #334155;\">Reaction to Timeout</th>\n                        <th style=\"padding:6px; border:1px solid #334155;\">Reaction to 3 Duplicate ACKs</th>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>TCP Tahoe (1988)</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><code>ssthresh = cwnd/2</code><br><code>cwnd = 1 MSS</code><br>Enter Slow Start</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Same as timeout:</strong><br><code>ssthresh = cwnd/2</code><br><code>cwnd = 1 MSS</code><br>Enter Slow Start (Harsh penalty)</td>\n                      </tr>\n                      <tr style=\"background:#0f172a;\">\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>TCP Reno (1990)</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><code>ssthresh = cwnd/2</code><br><code>cwnd = 1 MSS</code><br>Enter Slow Start</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Fast Recovery:</strong><br><code>ssthresh = cwnd/2</code><br><code>cwnd = ssthresh + 3 MSS</code><br>Skips Slow Start! Stays in Congestion Avoidance.</td>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>TCP NewReno (1999)</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><code>ssthresh = cwnd/2</code><br><code>cwnd = 1 MSS</code><br>Enter Slow Start</td>\n                        <td style=\"padding:6px   <p>Accurate RTT calculation is vital. Setting RTO too short causes unnecessary duplicate transmissions; setting RTO too long causes slow recovery.</p>\n            ", "children": [{"name": "7.1 Jacobson's Adaptive EWMA Algorithm", "details": "\n                    <h3>Jacobson's RTT & Deviation Estimator (RFC 6298)</h3>\n                    <p>Calculates moving average and variance to dynamically adapt to network jitter:</p>\n                    <ol>\n                      <li><strong>EstimatedRTT (EWMA):</strong>\n                        $$\\text{EstimatedRTT} = (1 - \\alpha) \\times \\text{EstimatedRTT} + \\alpha \\times \\text{SampleRTT}$$\n                        <em>Recommended value:</em> $\\alpha = 0.125$ ($1/8$).\n                      </li>\n                      <li><strong>DevRTT (Mean Absolute Deviation):</strong>\n                        $$\\text{DevRTT} = (1 - \\beta) \\times \\text{DevRTT} + \\beta \\times |\\text{SampleRTT} - \\text{EstimatedRTT}|$$\n                        <em>Recommended value:</em> $\\beta = 0.25$ ($1/4$).\n                      </li>\n                      <li><strong>TimeoutInterval (RTO):</strong>\n                        $$\\text{TimeoutInterval} = \\text{EstimatedRTT} + 4 \\times \\text{DevRTT}$$\n                      </li>\n                    </ol>\n                    <p><em>Safety Margin:</em> The $4 \\times \\text{DevRTT}$ margin prevents spurious timeouts during temporary packet delay spikes.</p>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; =Reliable\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            "}]}, {"name": "8.2 UDP 8-Byte Header & Checksum Architecture", "details": "\n                    <h3>UDP Header Fields & 1's Complement Checksum</h3>\n                    <ul>\n                      <li><strong>8-Byte Header:</strong>\n                        <ol>\n                          <li>Source Port (16 bits) - Optional, 0 if unused.</li>\n                          <li>Destination Port (16 bits) - Mandatory for demux.</li>\n                          <li>Length (16 bits) - Total bytes of UDP header + data (minimum 8).</li>\n                          <li>Checksum (16 bits) - Error detection over pseudo-header + header + data.</li>\n                        </ol>\n                      </li>\n                      <li><strong>Pseudo-Header Inclusion:</strong> Checksum includes 12 bytes from IP header (Source IP, Dest IP, 0x00, Protocol 17, UDP Length). Prevents misrouted packets from being accepted by wrong host!</li>\n                    </ul>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 29x Asked</span>\n              </d \n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 19x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 19 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>List down the steps involved in SSL handshaking. Also present apictorial view of packet transmission</em></li><li><em>Briefly explain how Secure Socket Layer (SSL) works on top of TCP and what services it provides.</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=TLS\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            ", "children": [{"name": "9.1 The 4-Phase TLS Handshake (Slide 359 Diagram)", "details": "\n                    <h3>The 4-Phase TLS Handshake Progression</h3>\n                    <ol>\n                      <li><strong>Phase 1: Establish Security Capabilities:</strong>\n                        <ul>\n                          <li><code>ClientHello</code>: Supported cipher suites, client random ($R_c$), TLS version.</li>\n                          <li><code>ServerHello</code>: Chosen cipher suite, server random ($R_s$), Session ID.</li>\n                        </ul>\n                      </li>\n                      <li><strong>Phase 2: Server Authentication & Key Exchange:</strong>\n                        <ul>\n                          <li><code>Certificate</code>: Server's X.509 public key certificate signed by CA.</li>\n                          <li><code>ServerKeyExchange</code>: Diffie-Hellman parameters (if ephemeral DH used).</li>\n                          <li><code>ServerHelloDone</code>: Signals end of server negotiation messages.</li>\n                        </ul>\n                      </li>\n                      <li><strong>Phase 3: Client Authentication & Key Exchange:</strong>\n                        <ul>\n                          <li><code>ClientKeyExchange</code>: Client sends <strong>Pre-Master Secret (PMS)</strong> encrypted with Server's RSA public key (or Client DH share).</li>\n                        </ul>\n                      </li>\n                      <li><strong>Phase 4: Cipher Activation & Finish:</strong>\n                        <ul>\n                          <li><code>ChangeCipherSpec</code>: Both sides activate negotiated cryptographic algorithms.</li>\n                          <li><code>Finished</code>: First encrypted message containing HMAC over all prior handshake messages to prevent tampering / downgrade attacks.</li>\n                        </ul>\n                      </li>\n                    </ol>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 25x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 25 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>Compare the contrast link-state and distance vector routing algorithms.</em></li><li><em>Consider the network shown in following figure and assume that each node initially (12)  knows the c</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=Routing\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            ", "children": [{"name": "Phase 1: Security Capabilities", "details": "ClientHello & ServerHello negotiate cipher suite and exchange random nonces Rc, Rs."}, {"name": "Phase 2: Server Auth & Key Exchange", "details": "Server presents X.509 certificate and optional Diffie-Hellman parameters."}, {"name": "Phase 3: Client Key Exchange", "details": "Client generates and transmits 48-byte Pre-Master Secret encrypted under server's public key."}, {"name": "Phase 4: Finished & Cipher Activation", "details": "ChangeCipherSpec activates encryption; Finished validates handshake integrity via HMAC."}]}, {"name": "9.2 Key Derivation Hierarchy", "details": "\n                    <h3>Master Secret & 4 Session Keys Derivation</h3>\n                    <p>Both client and server independently compute the 48-byte Master Secret using the Pseudo-Random Function (PRF):</p>\n                    $$\\text{Master Secret} = \\text{PRF}(\\text{Pre-Master Secret}, \\text{\"master secret\"}, R_c + R_s)$$\n                    <p>The Master Secret is expanded into a key block sliced into <strong>4 distinct operational keys</strong>:</p>\n                    <ol>\n                      <li><code>Client Write MAC Key</code>: Client integrity generation; Server integrity verification.</li>\n                      <li><code>Server Write MAC Key</code>: Server integrity generation; Client integrity verification.</li>\n                      <li><code>Client Write Encryption Key</code>: Client data encryption; Server decryption.</li>\n                      <li><code>Server Write Encryption Key</code>: Server data encryption; Client decryption.</li>\n                    </ol>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 29x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 29 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>What should be the relation between window sizes and sequence number in case of Selective Repeat? Wh</em></li><li><em>Consider the data bits D=11011011 and Generator G = 10110. Calculate the Cyclic Redundancy Check bit</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=Reliable\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            ", "children": [{"name": "Pre-Master Secret -> 48-Byte Master Secret", "details": "Calculated via PRF over Pre-Master Secret and random nonces Rc, Rs."}, {"name": "4 Sliced Operational Keys", "details": "Client/Server Write MAC keys (integrity) and Client/Server Write Encryption keys (confidentiality)."}]}, {"name": "9.3 TLS 1.2 vs TLS 1.3 Disambiguation (Slide 366 Diagram)", "details": "\n                    <h3>Disambiguation: TLS 1.2 vs TLS 1.3 Architecture</h3>\n                    <table style=\"width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                      <tr style=\"background:#1e293b; color:#38bdf8;\">\n                        <th style=\"padding:6px; border:1px solid #334155;\">Metric</th>\n                        <th style=\"padding:6px; border:1px solid #334155;\">TLS 1.2 (RFC 5246)</th>\n                        <th style=\"padding:6px; border:1px solid #334155;\">TLS 1.3 (RFC 8446)</th>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Handshake Latency</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>2 RTT</strong> (after TCP handshake)</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>1 RTT</strong> (0-RTT with PSK resumption!)</td>\n                      </tr>\n                      <tr style=\"background:#0f172a;\">\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Key Exchange Mechanism</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\">RSA static key transport allowed. Server communicates key in Phase 2.</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Ephemeral Diffie-Hellman only (DHE/ECDHE).</strong> Client sends key share speculatively in ClientHello.</td>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Forward Secrecy</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\">Optional (compromised RSA private key decrypts past recorded traffic).</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Mandatory Perfect Forward Secrecy (PFS).</strong></td>\n                      </tr>\n                      <tr style=\"background:#0f172a;\">\n                        <td style=\"padding:6px; border:1px solid #334155;\"><strong>Permitted Cipher Suites</strong></td>\n                        <td style=\"padding:6px; border:1px solid #334155;\">30+ legacy suites including RC4, 3DES, CBC-mode ciphers.</td>\n                        <td style=\"padding:6px; border:1px solid #334155;\">Only <strong>5 AEAD ciphers</strong> (AES-GCM, ChaCha20-Poly1305). Stripped insecure ciphers.</td>\n                      </tr>\n                    </table>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 18x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 18 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>Why is UDP used in transport layer though it is unreliable?</em></li><li><em>As an application developer, why do you choose to run an application over UDP rather (06)  than TCP.</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-networks-sakhawat-sir-sadi-sir.html?search=UDP\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:#2563eb; color:#ffffff; text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold;\">\n                <span class=\"mono-emoji\">🔍</span> View Questions in Question Browser &rarr;\n              </a>\n            </div>\n            ", "children": [{"name": "1-RTT Handshake & 0-RTT Resumption", "details": "Client sends key shares speculatively in ClientHello, cutting handshake latency by half."}, {"name": "Mandatory Forward Secrecy (PFS)", "details": "Bans static RSA key exchange; ephemeral Diffie-Hellman guarantees past sessions cannot be decrypted."}, {"name": "AEAD Only Ciphers", "details": "Bans vulnerable CBC, RC4, and 3DES modes; mandates authenticated encryption."}]}]}, {"name": "10. The Master Disambiguation Matrix", "domain_id": 10, "details": "\n            <h3>The Master Networking Disambiguation Matrix</h3>\n            <p>Direct head-to-head comparisons resolving frequently confused networking mechanisms, protocols, and algorithmic boundaries.</p>\n            \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, tion 2: Go-Back-N vs Selective Repeat</h3>\n                    <ul>\n                      <li><strong>GBN:</strong> Cumulative ACK, single timer for oldest packet, discards out-of-order packets, retransmits entire window $N$. Window constraint $N \\le 2^k - 1$.</li>\n                      <li><strong>SR:</strong> Individual ACKs, independent timer per unacked packet, buffers out-of-order packets, retransmits only lost packets. Window constraint $N \\le 2^{k-1}$.</li>\n                    </ul>\n                    "}, {"name": "10.3 TCP vs UDP", "details": "\n                    <h3>Disambiguation 3: TCP vs UDP</h3>\n                    <ul>\n                      <li><strong>TCP:</strong> Connection-oriented, 4-tuple demux, reliable byte stream, flow & congestion control, 20-60B header.</li>\n                      <li><strong>UDP:</strong> Connectionless, 2-tuple demux, unreliable datagrams, application-driven rate, 8B fixed header.</li>\n                    </ul>\n                    \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:#38bdf8;\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; background:#eab308; color:#000;\">HIGH PRIORITY · 30x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:#cbd5e1; margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 30 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:#94a3b8; margin-left:14px; margin-bottom:8px;\">\n                <li><em>Suppose a TCP m
