<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machine Learning: Neural Networks & Tree Ensembles</title>
<style>
  :root {
    --bg-color: #121314;
    --canvas-bg: #121314;
    --grid-minor: rgba(255, 255, 255, 0.04);
    --grid-major: rgba(255, 255, 255, 0.09);
    --panel-bg: #1a1b1d;
    --panel-border: #555555;
    --text-primary: #f0f0ea;
    --text-secondary: #b0b0a8;
    --text-muted: #808078;
    --node-bg: #1a1b1d;
    --node-border: #555555;
    --link-color: rgba(160, 160, 160, 0.35);
    --link-pulse: #f0f0ea;
    --drawer-bg: #1a1b1d;
    --table-head-bg: #242528;
    --table-border: #555555;
    --table-stripe: #1e1f22;
    --btn-bg: #1e1f22;
    --btn-hover: #2a2b2f;
    --icon-color: #b0b0a8;
    --icon-hover: #f0f0ea;
    --font-serif: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", "Courier New", Courier, monospace;
  }

  body.light-theme {
    --bg-color: #f5f5f0;
    --canvas-bg: #f5f5f0;
    --grid-minor: rgba(0, 0, 0, 0.04);
    --grid-major: rgba(0, 0, 0, 0.09);
    --panel-bg: #ffffff;
    --panel-border: #111111;
    --text-primary: #111111;
    --text-secondary: #444444;
    --text-muted: #666666;
    --node-bg: #ffffff;
    --node-border: #111111;
    --link-color: rgba(60, 60, 60, 0.35);
    --link-pulse: #111111;
    --drawer-bg: #ffffff;
    --table-head-bg: #f5f5f0;
    --table-border: #111111;
    --table-stripe: #fafaf8;
    --btn-bg: #f9f9f6;
    --btn-hover: #eaeae4;
    --icon-color: #444444;
    --icon-hover: #111111;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0 !important;
  }

  ::selection {
    background: var(--text-primary);
    color: var(--panel-bg);
  }
  ::-moz-selection {
    background: var(--text-primary);
    color: var(--panel-bg);
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: var(--font-serif);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  #canvas-container {
    flex: 1;
    height: 100%;
    position: relative;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  #canvas-container:active { cursor: grabbing; }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Minimalist Graph Paper Grid */
  .grid-bg {
    transition: opacity 0.2s ease;
  }
  .grid-bg.hidden { opacity: 0; }

  /* Moving Organic Links */
  .link-path {
    fill: none;
    stroke: var(--link-color);
    stroke-width: 1.5px;
    stroke-linecap: square;
    transition: stroke 0.2s ease, stroke-width 0.2s ease;
  }
  .link-path.highlighted {
    stroke-width: 2.5px;
    stroke: var(--text-primary);
  }

  /* Draggable Node Pills / Wireframe Rectangles */
  .node-group {
    cursor: grab;
    transition: filter 0.15s ease;
    user-select: none;
    -webkit-user-select: none;
  }
  .node-group:active { cursor: grabbing; }

  .node-capsule {
    rx: 0px !important;
    ry: 0px !important;
    stroke-width: 1.5px;
    transition: stroke 0.2s ease, stroke-width 0.2s ease, filter 0.2s ease;
  }
  .node-capsule:hover {
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
  }
  body:not(.light-theme) .node-capsule:hover {
    filter: drop-shadow(0 4px 10px rgba(255, 255, 255, 0.25));
  }
  .node-capsule.selected {
    stroke-width: 2.5px !important;
    stroke: var(--text-primary) !important;
    filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.4)) !important;
  }
  body:not(.light-theme) .node-capsule.selected {
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4)) !important;
  }
  .node-capsule.matched {
    stroke: var(--text-primary) !important;
    stroke-width: 3px !important;
    stroke-dasharray: 4 2;
  }

  .node-label {
    font-size: 13px;
    font-weight: 500;
    fill: var(--text-primary);
    font-family: var(--font-serif);
    pointer-events: none;
    letter-spacing: 0.1px;
  }
  .node-label.root-label {
    font-size: 14.5px;
    font-weight: 700;
    font-style: italic;
    fill: var(--text-primary);
  }
  .node-label.domain-label {
    font-size: 13.5px;
    font-weight: 600;
  }

  .status-dot {
    pointer-events: none;
  }

  .badge-count {
    font-size: 11px;
    font-weight: 700;
    fill: #ffffff;
    font-family: var(--font-mono);
    pointer-events: none;
  }

  /* Minimalist Floating Toolbar with Pure Monochrome Icons */
  .toolbar {
    position: absolute;
    top: 16px;
    left: 20px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 2px 2px 0px var(--panel-border);
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 10px;
    border-right: 1px solid var(--panel-border);
    font-size: 13.5px;
    font-weight: 700;
    font-family: var(--font-serif);
    color: var(--text-primary);
    user-select: none;
    -webkit-user-select: none;
  }
  .live-dot {
    width: 7.5px;
    height: 7.5px;
    background: var(--text-primary);
    border-radius: 0 !important;
  }

  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap input {
    background: var(--btn-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-primary);
    font-family: var(--font-serif);
    border-radius: 0 !important;
    padding: 5px 10px 5px 28px;
    font-size: 12.5px;
    width: 190px;
    outline: none !important;
    transition: all 0.15s ease;
  }
  .search-wrap input:focus {
    width: 240px;
    border-color: var(--text-primary);
    background: var(--panel-bg);
  }
  .search-ico {
    position: absolute;
    left: 9px;
    display: flex;
    align-items: center;
    color: var(--icon-color);
    pointer-events: none;
  }

  .search-badge {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--panel-bg);
    background: var(--text-primary);
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    padding: 2px 7px;
    display: none;
    white-space: nowrap;
  }

  /* Monochrome Icon Buttons (No text!) */
  .mono-btn {
    background: var(--btn-bg);
    border: 1px solid var(--panel-border);
    color: var(--icon-color);
    border-radius: 0 !important;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s ease;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    outline: none !important;
  }
  .mono-btn svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    display: block;
  }
  .mono-btn:hover {
    background: var(--text-primary);
    color: var(--panel-bg);
    border-color: var(--text-primary);
  }
  .mono-btn.active {
    background: var(--text-primary) !important;
    color: var(--panel-bg) !important;
    border-color: var(--text-primary) !important;
  }

  /* Backdrop Overlay when Details Drawer is Open */
  .drawer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.48);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .drawer-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  body.light-theme .drawer-overlay {
    background: rgba(0, 0, 0, 0.25);
  }

  /* Sleek Slide-over Details Drawer */
  .details-drawer {
    width: 500px;
    max-width: 92vw;
    height: 100%;
    background: var(--drawer-bg);
    border-left: 2px solid var(--panel-border);
    border-radius: 0 !important;
    box-shadow: -10px 0 30px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 20;
    position: absolute;
    right: 0;
    top: 0;
  }
  .details-drawer.open {
    transform: translateX(0);
  }

  .drawer-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .drawer-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 0 !important;
    border: 1px solid var(--panel-border);
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-mono);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .drawer-title {
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-serif);
    line-height: 1.35;
    color: var(--text-primary);
  }

  .drawer-bar {
    padding: 8px 20px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    gap: 8px;
    background: var(--btn-bg);
  }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 22px;
    font-size: 14px;
    line-height: 1.65;
    font-family: var(--font-serif);
    color: var(--text-secondary);
  }
  .drawer-body h3 {
    color: var(--text-primary);
    margin: 16px 0 8px 0;
    font-size: 15px;
    font-weight: 700;
    font-family: var(--font-serif);
  }
  .drawer-body p { margin-bottom: 12px; }
  .drawer-body ul, .drawer-body ol { padding-left: 22px; margin-bottom: 12px; }
  .drawer-body li { margin-bottom: 6px; }
  .drawer-body strong { color: var(--text-primary); font-family: var(--font-serif); }
  .drawer-body em { font-style: italic; }
  .drawer-body code {
    background: var(--btn-bg);
    color: var(--text-primary);
    padding: 2px 6px;
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    font-family: var(--font-mono);
    font-size: 12px;
  }

  /* Clean Academic Tables */
  .drawer-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0 18px 0;
    font-size: 13px;
    border-radius: 0 !important;
    overflow: hidden;
    font-family: var(--font-serif);
    border: 1px solid var(--table-border);
  }
  .drawer-body th, .drawer-body td {
    padding: 8px 11px;
    border: 1px solid var(--table-border);
    text-align: left;
    vertical-align: top;
  }
  .drawer-body th {
    background: var(--table-head-bg);
    color: var(--text-primary);
    font-weight: 700;
  }
  .drawer-body tr:nth-child(even) { background: var(--table-stripe); }

  /* Concept Pills */
  .concept-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 10px 0 16px 0;
  }
  .concept-pill {
    background: var(--btn-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-secondary);
    font-family: var(--font-serif);
    border-radius: 0 !important;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.1s ease;
  }
  .concept-pill:hover {
    background: var(--text-primary);
    color: var(--panel-bg);
    border-color: var(--text-primary);
  }

  /* Minimalist Footer Hint */
  .hint-pill {
    position: absolute;
    bottom: 16px;
    left: 20px;
    font-size: 12px;
    font-family: var(--font-serif);
    color: var(--text-muted);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    padding: 4px 12px;
    pointer-events: none;
    box-shadow: 2px 2px 0px var(--panel-border);
  }

  /* Robust Drawer Theme Adaptations */
  body.light-theme .drawer-body div[style*="background"] {
    background: var(--btn-bg) !important;
    border-color: var(--panel-border) !important;
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body span[style*="color:#38bdf8"],
  body.light-theme .drawer-body p[style*="color:#38bdf8"],
  body.light-theme .drawer-body a[style*="color:#38bdf8"] {
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body p[style*="color:#cbd5e1"],
  body.light-theme .drawer-body ul[style*="color:#94a3b8"] {
    color: var(--text-secondary) !important;
  }
  body.light-theme .drawer-body tr[style*="background:#1e293b"] {
    background: var(--table-head-bg) !important;
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body tr[style*="background:#1e293b"] th {
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body tr[style*="background:#0f172a"] {
    background: var(--table-stripe) !important;
  }
  body.light-theme .drawer-body a[style*="background"] {
    background: var(--text-primary) !important;
    color: var(--panel-bg) !important;
    border: 1px solid var(--panel-border) !important;
  }

  /* Retro Monochrome Emojis */
  .mono-emoji {
    display: inline-block;
    vertical-align: -0.1em;
    line-height: 1;
    filter: grayscale(100%) brightness(0.65) contrast(160%);
    -webkit-filter: grayscale(100%) brightness(0.65) contrast(160%);
    transition: filter 0.1s ease;
  }
  body:not(.light-theme) .mono-emoji {
    filter: grayscale(100%) brightness(1.75) contrast(140%);
    -webkit-filter: grayscale(100%) brightness(1.75) contrast(140%);
  }
  body.light-theme .drawer-body a[style*="background"] .mono-emoji,
  body.light-theme .btn:hover .mono-emoji,
  body.light-theme button:hover .mono-emoji {
    filter: grayscale(100%) brightness(2.2) contrast(150%) !important;
    -webkit-filter: grayscale(100%) brightness(2.2) contrast(150%) !important;
  }
</style>
</head>
<body>

<div id="canvas-container">
  <div class="toolbar">
    <div class="brand">
      <div class="live-dot"></div>
      <span>Machine Learning: Neural Networks & Tree Ensembles</span>
    </div>

    <div class="search-wrap">
      <span class="search-ico">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input type="text" id="search-input" placeholder="Search concepts (Tahoe, Karn, AIMD)...">
    </div>
    <span class="search-badge" id="search-badge">0</span>

    <!-- Search Prev/Next (Monochrome Icons) -->
    <button class="mono-btn" id="search-prev" style="display:none;" title="Previous Match">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <button class="mono-btn" id="search-next" style="display:none;" title="Next Match">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>

    <!-- Theme Switcher (Monochrome Sun/Moon Icon) -->
    <button class="mono-btn" id="btn-theme" title="Toggle Light / Dark Mode">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>

    <!-- Grid Toggle (Monochrome Grid Icon) -->
    <button class="mono-btn active" id="btn-grid" title="Toggle Graph Paper Grid">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
    </button>

    <!-- Reset Layout (Monochrome Reset Icon) -->
    <button class="mono-btn" id="btn-reset" title="Reset Layout to Default Radial Grid">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
    </button>

    <!-- Fit View (Monochrome Crosshairs / Fit Icon) -->
    <button class="mono-btn" id="btn-fit" title="Zoom to Fit">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><polyline points="21 15 21 21 15 21"></polyline><polyline points="3 9 3 3 9 3"></polyline></svg>
    </button>

    <!-- Expand All (Monochrome Tree Expand Icon) -->
    <button class="mono-btn" id="btn-expand" title="Expand All Branches">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
    </button>

    <!-- Collapse All (Monochrome Tree Fold Icon) -->
    <button class="mono-btn" id="btn-collapse" title="Collapse to Domains">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
    </button>
  </div>

  <svg id="svg-canvas">
    <defs>
      <!-- Engineering Graph Paper Grid -->
      <pattern id="grid-pattern-minor" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--grid-minor)" stroke-width="0.75" />
      </pattern>
      <pattern id="grid-pattern-major" width="120" height="120" patternUnits="userSpaceOnUse">
        <rect width="120" height="120" fill="url(#grid-pattern-minor)" />
        <path d="M 120 0 L 0 0 0 120" fill="none" stroke="var(--grid-major)" stroke-width="1.2" />
      </pattern>
    </defs>

    <g id="viewport">
      <!-- Infinite Graph Paper Grid Plane -->
      <rect id="grid-plane" class="grid-bg" x="-10000" y="-10000" width="20000" height="20000" fill="url(#grid-pattern-major)" />

      <!-- Moving Links Layer -->
      <g id="links-layer"></g>

      <!-- Movable Nodes Layer -->
      <g id="nodes-layer"></g>
    </g>
  </svg>

  <div class="hint-pill">
    Drag nodes to reposition • Scroll to zoom • Click +/- to toggle branch • Click node for details
  </div>
</div>

<!-- Backdrop Overlay for Details Drawer -->
<div class="drawer-overlay" id="drawer-overlay"></div>

<div class="details-drawer" id="details-drawer">
  <div class="drawer-head">
    <div style="display: flex; align-items: flex-start; gap: 10px; flex: 1;">
      <!-- Monochrome Back Button -->
      <button class="mono-btn" id="drawer-back" title="Go Back to Previous Concept" disabled style="margin-top: 2px; flex-shrink: 0; opacity: 0.35; cursor: not-allowed; pointer-events: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <div style="flex: 1; min-width: 0;">
        <div class="drawer-badge" id="drawer-badge">Overview</div>
        <div class="drawer-title" id="drawer-title">Node Title</div>
      </div>
    </div>
    <!-- Monochrome Close Button -->
    <button class="mono-btn" id="drawer-close" title="Close Panel" style="flex-shrink: 0;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  <div class="drawer-bar">
    <!-- Monochrome Back Button in Action Bar -->
    <button class="mono-btn" id="bar-btn-back" title="Go Back to Previous Concept" disabled style="opacity: 0.35; cursor: not-allowed; pointer-events: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <!-- Monochrome Center/Focus Button -->
    <button class="mono-btn" id="bar-btn-focus" title="Center in View">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line></svg>

ONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            ", "children": [{"name": "Confusion Matrix & Derived Metrics", "details": "\n                        <h4>Confusion Matrix Taxonomy</h4>\n                        <table style=\"width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                          <tr style=\"background:#1e293b; color:#38bdf8;\">\n                            <th style=\"padding:6px; border:1px solid #334155;\">Metric</th>\n                            <th style=\"padding:6px; border:1px solid #334155;\">Formula</th>\n                            <th style=\"padding:6px; border:1px solid #334155;\">Focus</th>\n                          </tr>\n                          <tr>\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>Accuracy</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">$\\frac{TP + TN}{TP + TN + FP + FN}$</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Overall correctness (misleading on imbalanced datasets).</td>\n                          </tr>\n                          <tr style=\"background:#0f172a;\">\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>Precision</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">$\\frac{TP}{TP + FP}$</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Quality of positive predictions (minimizes false alarms).</td>\n                          </tr>\n                          <tr>\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>Recall (Sensitivity)</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">$\\frac{TP}{TP + FN}$</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Coverage of true positives (critical in medical diagnostics).</td>\n                          </tr>\n                          <tr style=\"background:#0f172a;\">\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>$F_1$-Score</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">$2 \\cdot \\frac{\\text{Precision} \\cdot \\text{Recall}}{\\text{Precision} + \\text{Recall}}$</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Harmonic mean balancing precision and recall.</td>\n                          </tr>\n                        </table>\n                        "}, {"name": "ROC-AUC & Cross-Validation Strategies", "details": "\n                        <h4>Threshold-Independent Evaluation</h4>\n                        <ul>\n                          <li><strong>ROC Curve:</strong> Plots True Positive Rate (Sensitivity) vs False Positive Rate ($1 - \\text{Specificity}$) across all classification thresholds.</li>\n                          <li><strong>AUC-ROC:</strong> Area under the ROC curve ($1.0$ is perfect, $0.5$ is random guessing). Measures ranking quality regardless of class imbalance.</li>\n                          <li><strong>$k$-Fold Cross Validation:</strong> Partitions data into $k$ equal subsets; trains on $k-1$ and evaluates on $1$, repeated $k$ times to prevent overfitting.</li>\n                        </ul>\n                        "}]}, {"name": "3. Backpropagation Calculus & Gradient Descent", "details": "\n                <h3>Exact Chain-Rule Derivation of Error Signals</h3>\n                <p>Derives analytical gradients of squared error loss $E = \\frac{1}{2} \\sum_k (t_k - y_k)^2$ through multi-layer networks.</p>\n                \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">MEDIUM PRIORITY · 14x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 14 subquestions across 8 exam sessions (2020, 2021, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>What is the local gradient in Back Propagation (BP) learning algorithm? \"Local (09)  gradient may be</em></li><li><em>What is the effect of learning rate in BP? How momentum parameters speed up training in (10)</em></li>\n              </ul>\n              <a href=\"../question-browser/machine-learning-akhand-sir-rocky-sir.html?search=Backpropagation\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            ", "children": [{"name": "Output Layer Error Signal (delta_k)", "details": "\n                        <h4>Output Layer Gradient Calculus</h4>\n                        <p>By the multivariable chain rule:</p>\n                        <p style=\"text-align:center;\">$$\\frac{\\partial E}{\\partial w_{kj}} = \\frac{\\partial E}{\\partial y_k} \\cdot \\frac{\\partial y_k}{\\partial net_k} \\cdot \\frac{\\partial net_k}{\\partial w_{kj}}$$</p>\n                        <ul>\n                          <li>$\\frac{\\partial E}{\\partial y_k} = -(t_k - y_k)$</li>\n                          <li>$\\frac{\\partial y_k}{\\partial net_k} = f'(net_k) = y_k(1 - y_k) \\quad (\\text{for sigmoid})$</li>\n                          <li>$\\frac{\\partial net_k}{\\partial w_{kj}} = y_j$ (output from hidden unit $j$)</li>\n                        </ul>\n                        <p>Defining error signal $\\delta_k = (t_k - y_k) f'(net_k)$:</p>\n                        <p style=\"text-align:center; font-weight:bold;\">$$\\Delta w_{kj} = \\eta \\cdot \\delta_k \\cdot y_j$$</p>\n                        "}, {"name": "Hidden Layer Error Propagation (delta_j)", "details": "\n                        <h4>Hidden Layer Gradient Backpropagation</h4>\n                        <p>Hidden unit $j$ affects the total error $E$ indirectly through ALL output units $k$ to which it connects:</p>\n                        <p style=\"text-align:center;\">$$\\delta_j = f'(net_j) \\sum_{k} \\delta_k w_{kj}$$</p>\n                        <p>Weight update for input-to-hidden connections:</p>\n                        <p style=\"text-align:center; font-weight:bold;\">$$\\Delta w_{ji} = \\eta \\cdot \\delta_j \\cdot x_i$$</p>\n                        <p>Recursively propagates errors backward from output to input.</p>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text ch Mode & Momentum (alpha)", "details": "\n                        <h4>Gradient Descent Variants & Momentum</h4>\n                        <table style=\"width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                          <tr style=\"background:#1e293b; color:#38bdf8;\">\n                            <th style=\"padding:6px; border:1px solid #334155;\">Mode</th>\n                            <th style=\"padding:6px; border:1px solid #334155;\">Update Frequency</th>\n                            <th style=\"padding:6px; border:1px solid #334155;\">Convergence Characteristics</th>\n                          </tr>\n                          <tr>\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>Pattern (Online / SGD)</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Updated after every single training example.</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Noisy gradient steps help escape shallow local minima; fast early progress.</td>\n                          </tr>\n                          <tr style=\"background:#0f172a;\">\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>Batch Mode</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Updated once per epoch over all $N$ patterns.</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">True gradient of total error surface; smooth but computationally slow.</td>\n                          </tr>\n                        </table>\n                        <div style=\"margin-top:8px;\">\n                          <strong>Momentum Term Update Rule:</strong>\n                          $$\\Delta w(t) = \\eta \\delta x + \\alpha \\Delta w(t-1) \\quad (0 \\le \\alpha < 1)$$\n                          <p>Dampens oscillations across ravines and accelerates through flat plateau error surfaces.</p>\n                        </div>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">MEDIUM PRIORITY · 14x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 14 subquestions across 8 exam sessions (2020, 2021, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>What is the local gradient in Back Propagation (BP) learning algorithm? \"Local (09)  gradient may be</em></li><li><em>What is the effect of learning rate in BP? How momentum parameters speed up training in (10)</em></li>\n              </ul>\n              <a href=\"../question-browser/machine-learning-akhand-sir-rocky-sir.html?search=Backpropagation\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            "}, {"name": "Bias-Variance Tradeoff & Regularization", "details": "\n                        <h4>Generalization Error Decomposition</h4>\n                        <p style=\"text-align:center;\">$$\\text{Expected Error} = \\text{Bias}^2 + \\text{Variance} + \\sigma_{noise}^2$$</p>\n                        <ul>\n                          <li><strong>High Bias (Underfitting):</strong> Model too simple; high training and test error.</li>\n                          <li><strong>High Variance (Overfitting):</strong> Model memorizes training noise; low train error, high test error.</li>\n                          <li><strong>Countermeasures:</strong> $L_2$ Weight Decay ($E_{reg} = E + \\frac{\\lambda}{2}\\sum w^2$), early stopping based on validation loss, and dropout.</li>\n                        </ul>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">HIGH PRIORITY · 23x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 23 subquestions across 8 exam sessions (2020, 2021, 2023, 2024).\ </strong> Cluster centers $\\mu_j$ and widths $\\sigma_j$ determined via $k$-means clustering.</li>\n                          <li><strong>Supervised Stage:</strong> Output weights $w_{kj}$ solved analytically in ONE step via pseudoinverse / linear least squares: $W = (\\Phi^T \\Phi)^{-1} \\Phi^T T$.</li>\n                        </ol>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">HIGH PRIORITY · 28x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 28 subquestions across 8 exam sessions (2020, 2021, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>Describe importance of bias weight value in artificial neuron construction. \"Changing (08)  only the</em></li><li><em>What is the condition to use a function as activation function in artificial neural (09)  network? G</em></li>\n              </ul>\n              <a href=\"../question-browser/machine-learning-akhand-sir-rocky-sir.html?search=Neural\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            "}, {"name": "Architectural Disambiguation: MLP vs RBF", "details": "\n                        <h4>MLP vs RBF Comparison</h4>\n                        <table style=\"width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                          <tr style=\"background:#1e293b; color:#38bdf8;\">\n                            <th style=\"padding:6px; border:1px solid #334155;\">Property</th>\n                            <th style=\"padding:6px; border:1px solid #334155;\">Multi-Layer Perceptron (MLP)</th>\n                            <th style=\"padding:6px; border:1px solid #334155;\">Radial Basis Function (RBF)</th>\n                          </tr>\n                          <tr>\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>Activation Unit</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Global sigmoidal / ReLU hyperplanes spanning infinite input space.</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Localized Gaussian spherical receptive fields (active only near $\\mu_j$).</td>\n                          </tr>\n                          <tr style=\"background:#0f172a;\">\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>Optimization</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Slow, iterative non-linear gradient descent across all layers.</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Fast two-stage hybrid: unsupervised clustering + linear matrix solve.</td>\n                          </tr>\n                        </table>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">HIGH PRIORITY · 28x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 28 subquestions across 8 exam sessions (2020, 2021, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>Describe importance of bias weight value in artificial neuron construction. \"Changing (08)  only the</em></li><li><em>What is the condition to use a function as activation function in artificial neural (09)  network? G</em></li>\n              </ul>\n              <a href=\"../question-browser/machine-learning-akhand-sir-rocky-sir.html?search=Neural\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            "}]}, {"name": "6. Neural Ensembles & Negative Correlation Learning", "details": "\n                <h3>Ensemble Diversity Theory & Cooperative Learning</h3>\n                <p>Combines diverse individual predictors to reduce total generalization variance.</p>\n                <div style=\"margin-top:8px;\">\n                  <strong>Error-Ambiguity Decomposition (Krogh & Vedelsby):</strong>\n                  $$E_{ensemble} = \\bar{E} - \\bar{A}$$\n                  <p>Ensemble error is guaranteed to be strictly less than or equal to the average individual error $\\bar{E}$ by an amount equal to ensemble ambiguity / diversity $\\bar{A}$.</p>\n                </div>\n                \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">HIGH PRIORITY · 28x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 28 subquestions across 8 exam sessions (2020, 2021, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>Describe importance of bias weight value in artificial neuron construction. \"Changing (08)  only the</em></li><li><em>What is the condition to use a function as activation function in artificial neural (09)  network? G</em></li>\n              </ul>\n              <a href=\"../question-browser/machine-learning-akhand-sir-rocky-sir.html?search=Neural\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            ", "children": [{"name": "Negative Correlation Learning (NCL)", "details": "\n                        <h4>Penalized Correlation Objective Function</h4>\n                        <p>Instead of training individual networks independently, NCL (Liu & Yao) trains all ensemble members simultaneously with a correlation penalty term:</p>\n                        <p style=\"text-align:center; font-weight:bold;\">$$e_i = \\frac{1}{2}(t - f_i)^2 + \\lambda p_i$$</p>\n                        <p>Where correlation penalty $p_i = (f_i - f_{ens}) \\sum_{j \\ne i} (f_j - f_{ens})$.</p>\n                        <p>Gradients explicitly push networks to make negatively correlated errors: when one network overestimates, others are encouraged to underestimate, canceling errors out in the ensemble average!</p>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:ce "mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            ", "children": [{"name": "Splitting Criteria: Entropy vs Gini Impurity", "details": "\n                        <h4>Mathematical Impurity Formulations</h4>\n                        <table style=\"width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                          <tr style=\"background:#1e293b; color:#38bdf8;\">\n                            <th style=\"padding:6px; border:1px solid #334155;\">Algorithm</th>\n                            <th style=\"padding:6px; border:1px solid #334155;\">Impurity Metric</th>\n                            <th style=\"padding:6px; border:1px solid #334155;\">Formula & Characteristics</th>\n                          </tr>\n                          <tr>\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>ID3 (Quinlan)</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Information Gain ($IG$)</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">$IG(S, A) = H(S) - \\sum \\frac{|S_v|}{|S|} H(S_v)$ where $H(S) = -\\sum p_i \\log_2 p_i$. Strongly biased toward attributes with many distinct values (e.g., Date, ID).</td>\n                          </tr>\n                          <tr style=\"background:#0f172a;\">\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>C4.5 (Quinlan)</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Gain Ratio ($GR$)</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">$GR(S, A) = \\frac{IG(S, A)}{\\text{SplitInfo}_A(S)}$. Normalizes by split entropy to penalize broad branching; supports continuous attributes and missing values.</td>\n                          </tr>\n                          <tr>\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>CART (Breiman)</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Gini Impurity</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">$Gini(S) = 1 - \\sum_{i=1}^C p_i^2$. Strictly binary splits; computationally faster (zero logarithm evaluations).</td>\n                          </tr>\n                        </table>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">MEDIUM PRIORITY · 19x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 19 subquestions across 8 exam sessions (2020, 2021, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>What are support vectors in Support Vector Machine (SVM)? How does Linear SVM work? Explain.</em></li><li><em>Can SVM be over trained? What can be the effect of over training? How will you detect over fitting o</em></li>\n              </ul>\n              <a href=\"../question-browser/machine-learning-akhand-sir-rocky-sir.html?search=Support\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            "}, {"name": "Tree Pruning: Pre-Pruning vs Post-Pruning", "details": "\n                        <h4>Mitigating Tree Overfitting</h4>\n                        <ul>\n                          <li><strong>Pre-Pruning (Early Stopping):</strong> Stop splitting if node sample count $< n_{\\min}$, depth $> d_{\\max}$, or purity gain $< \\epsilon$. Fast, but risks premature horizon stopping.</li>\n                          <li><strong>Post-Pruning (Cost-Complexity Pruning):</strong> Grow full tree, then prune bottom-up minimizing cost function $R_\\alpha(T) = R(T) + \\alpha |T|$ using a validation set. Significantly superior generalization.</li>\n                        </ul>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">HIGH PRIORITY · 23x Asked</span const EMOJI_REGEX = /([\u{1F300}-\u{1F9FF}\u{2600}-\u{27BF}\u{2300}-\u{23FF}\u{2B50}\u{2B55}\u{203C}\u{2049}\u{2139}\u{1FA00}-\u{1FAFF}\u{1F000}-\u{1F2FF}])/gu;

function makeEmojisMonochrome(root) {
  if (!root) root = document.body;
  if (!root) return;
  const walker = document.createTreeWalker(
    root,
    NodeFilter.SHOW_TEXT,
    {
      acceptNode: function(node) {
        if (!node.nodeValue || !node.nodeValue.match(EMOJI_REGEX)) {
          return NodeFilter.FILTER_SKIP;
        }
        const parent = node.parentElement;
        if (!parent) return NodeFilter.FILTER_SKIP;
        const tag = parent.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TEXTAREA' || tag === 'INPUT') {
          return NodeFilter.FILTER_REJECT;
        }
        if (parent.classList && parent.classList.contains('mono-emoji')) {
          return NodeFilter.FILTER_SKIP;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    }
  );

  const nodesToProcess = [];
  while (walker.nextNode()) {
    nodesToProcess.push(walker.currentNode);
  }

  nodesToProcess.forEach(textNode => {
    const parent = textNode.parentNode;
    if (!parent) return;
    const text = textNode.nodeValue;
    const parts = text.split(EMOJI_REGEX);
    if (parts.length <= 1) return;

    const fragment = document.createDocumentFragment();
    parts.forEach(part => {
      if (!part) return;
      if (part.match(EMOJI_REGEX)) {
        const span = document.createElement('span');
        span.className = 'mono-emoji';
        span.textContent = part;
        fragment.appendChild(span);
      } else {
        fragment.appendChild(document.createTextNode(part));
      }
    });
    parent.replaceChild(fragment, textNode);
  });
}

function buildGraphData(rawNode, depth = 0, domainIdx = 0, parent = null) {
  const node = {
    id: ++idCounter,
    name: rawNode.name,
    details: rawNode.details || "",
    depth: depth,
    domainIdx: depth === 0 ? -1 : (depth === 1 ? domainIdx : parent.domainIdx),
    parent: parent,
    _children: [],
    children: [],
    collapsed: depth >= 2, // Subtopics start collapsed
    x: 0,
    y: 0,
    targetX: 0,
    targetY: 0,
    width: 200,
    height: 36,
    radius: 20
  };

  // Dimensions with ample room for Times New Roman font
  const len = node.name.length;
  if (depth === 0) {
    node.width = 410;
    node.height = 46;
  } else if (depth === 1) {
    node.width = Math.min(370, Math.max(240, len * 7.7 + 56));
    node.height = 40;
  } else if (depth === 2) {
    node.width = Math.min(330, Math.max(210, len * 7.4 + 52));
    node.height = 36;
  } else {
    node.width = Math.min(300, Math.max(180, len * 7.0 + 48));
    node.height = 32;
  }
  node.radius = node.width / 2;

  nodeMap.set(node.id, node);
  nodes.push(node);

  if (parent) {
    links.push({ source: parent, target: node, length: depth === 1 ? 380 : (depth === 2 ? 300 : 220) });
  }

  const rawChildren = rawNode.children || [];
  rawChildren.forEach((childRaw, idx) => {
    const childNode = buildGraphData(childRaw, depth + 1, depth === 0 ? idx : domainIdx, node);
    node._children.push(childNode);
    if (!node.collapsed) {
      node.children.push(childNode);
    }
  });

  return node;
}

const rootNode = buildGraphData(rawData);

// Compute 360-degree Radial Staggered Multi-Orbit Geometry
function calculateRadialPositions() {
  rootNode.targetX = 0;
  rootNode.targetY = 0;
  rootNode.x = 0;
  rootNode.y = 0;

  // 10 Domains distributed with weighted sector widths based on child count and text lengths
  const domains = rootNode._children;
  const numDomains = domains.length;

  // Proportional sector weights giving domains with extensive text and subtopics ample room
  const weights = domains.map(d => {
    const subs = d._children || [];
    const totLen = subs.reduce((acc, s) => acc + (s.name.length || 20), 0);
    return Math.max(4.0, subs.length * 1.8 + totLen * 0.05);
  });
  const totalWeight = weights.reduce((sum, w) => sum + w, 0);

  let currentAngle = -Math.PI / 2;
  domains.forEach((dom, i) => {
    const domainSpan = (weights[i] / totalWeight) * (2 * Math.PI);
    const domainCenterAngle = currentAngle + domainSpan / 2;
    currentAngle += domainSpan;

    // Widescreen elliptical radial geometry to match horizontal capsule dimensions
    const r1x = 660;
    const r1y = 470;
    dom.targetX = r1x * Math.cos(domainCenterAngle);
    dom.targetY = r1y * Math.sin(domainCenterAngle);
    if (dom.x === 0 && dom.y === 0) {
      dom.x = dom.targetX;
      dom.y = dom.targetY;
    }

    // Subtopics and deeper concepts fanning out in domain sector
    const subtopics = dom._children || [];
    const numSub = subtopics.length;
    const subSector = domainSpan * 0.82;
    const tiers = numSub >= 3 ? 3 : (numSub >= 2 ? 2 : 1);

    function layoutDescendants(parentNode, parentAngle, parentRadiusX, parentRadiusY, depth) {
      const children = parentNode._children || [];
      if (children.length === 0) return;
      const count = children.length;
      const sector = depth === 2 ? subSector : Math.max(0.18, 0.42 / Math.pow(1.15, depth - 2));
      const childTiers = count >= 4 ? 2 : 1;

      children.forEach((child, k) => {
        const offset = count > 1 ? ((k - (count - 1) / 2) / (count - 1)) * sector : 0;
        const angle = parentAngle + offset;
        const tier = k % childTiers;
        const stepX = depth === 2 ? (1100 + tier * 350 - parentRadiusX) : (380 + tier * 180);
        const stepY = depth === 2 ? (800 + tier * 250 - parentRadiusY) : (260 + tier * 130);
        const rx = parentRadiusX + stepX;
        const ry = parentRadiusY + stepY;

        child.targetX = rx * Math.cos(angle);
        child.targetY = ry * Math.sin(angle);
        if (child.x === 0 && child.y === 0) {
          child.x = child.targetX;
          child.y = child.targetY;
        }

        layoutDescendants(child, angle, rx, ry, depth + 1);
      });
    }

    subtopics.forEach((sub, j) => {
      const subOffset = numSub > 1 ? ((j - (numSub - 1) / 2) / (numSub - 1)) * subSector : 0;
      const subAngle = domainCenterAngle + subOffset;
      const tierIdx = (j + (i % 2)) % tiers;

      const r2x = 1100 + tierIdx * 350;
      const r2y = 800 + tierIdx * 250;
      sub.targetX = r2x * Math.cos(subAngle);
      sub.targetY = r2y * Math.sin(subAngle);
      if (sub.x === 0 && sub.y === 0) {
        sub.x = sub.targetX;
        sub.y = sub.targetY;
      }

      layoutDescendants(sub, subAngle, r2x, r2y, 3);
    });
  });

  // Run geometric overlap removal on all initial positions to guarantee zero collisions
  resolveOverlaps(false);

  // Store settled positions as targetX / targetY for reset button
  nodes.forEach(n => {
    n.targetX = n.x;
    n.targetY = n.y;
  });
}

// Deterministic Non-Physics Overlap Removal Pass (Executes once upon render/toggle)
function resolveOverlaps(onlyVisible = true) {
  const targetNodes = onlyVisible ? nodes.filter(isVisible) : nodes;
  const maxIters = 80;
  for (let it = 0; it < maxIters; it++) {
    let moved = false;
    for (let a = 0; a < targetNodes.length; a++) {
      for (let b = a + 1; b < targetNodes.length; b++) {
        const nA = targetNodes[a];
        const nB = targetNodes[b];

        // Safety margins: horizontal width + 40px, vertical height + 28px
        const minDx = (nA.width + nB.width) / 2 + 40;
        const minDy = (nA.height + nB.height) / 2 + 28;
        const dx = nB.x - nA.x;
        const dy = nB.y - nA.y;
        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);

        if (absDx < minDx && absDy < minDy) {
          const overlapX = minDx - absDx;
          const overlapY = minDy - absDy;

          // Push along the axis of smaller relative penetration
          if (overlapX / minDx < overlapY / minDy) {
            const pushX = (overlapX / 2) * (dx >= 0 ? 1 : -1);
            if (nA.depth > 0 && !nA.isPinned) nA.x -= pushX;
            if (nB.depth > 0 && !nB.isPinned) nB.x += pushX;
          } else {
            const pushY = (overlapY / 2) * (dy >= 0 ? 1 : -1);
            if (nA.depth > 0 && !nA.isPinned) nA.y -= pushY;
            if (nB.depth > 0 && !nB.isPinned) nB.y += pushY;
          }
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
}

  isPanning = true;
  startPan = { x: e.clientX - transform.x, y: e.clientY - transform.y };
});

  if (!isPanning) return;
  transform.x = e.clientX - startPan.x;

});

// Canvas zoom
container.addEventListener("wheel", (e) => {
  e.preventDefault();
  const zoomFactor = 1.14;
  const direction = e.deltaY < 0 ? 1 : -1;
  const factor = direction > 0 ? zoomFactor : 1 / zoomFactor;

  const mouseX = e.clientX;
  const mouseY = e.clientY;

  transform.x = mouseX - (mouseX - transform.x) * factor;
  transform.y = mouseY - (mouseY - transform.y) * factor;
  transform.k *= factor;
  transform.k = Math.max(0.12, Math.min(transform.k, 3.0));
  updateTransform();
}, { passive: false });

      draggedNode = n;
      const startMouseX = e.clientX;
      const startMouseY = e.clientY;
      let prevWorldX = (startMouseX - transform.x) / transform.k;
      let prevWorldY = (startMouseY - transform.y) / transform.k;
      let hasMoved = false;

      function onMouseMove(moveEvent) {
        const curWorldX = (moveEvent.clientX - transform.x) / transform.k;
        const curWorldY = (moveEvent.clientY - transform.y) / transform.k;
        const deltaX = curWorldX - prevWorldX;
        const deltaY = curWorldY - prevWorldY;
        prevWorldX = curWorldX;
        prevWorldY = curWorldY;

        if (Math.abs(moveEvent.clientX - startMouseX) > 3 || Math.abs(moveEvent.clientY - startMouseY) > 3) {
          hasMoved = true;
        }

        // Move the dragged node
        draggedNode.x += deltaX;
        draggedNode.y += deltaY;

        // Move all descendant nodes recursively by the same delta
        function moveSubtree(node, dx, dy) {
          if (!node._children) return;
          for (const child of node._children) {
            child.x += dx;
            child.y += dy;
            moveSubtree(child, dx, dy);
          }
        }
        moveSubtree(draggedNode, deltaX, deltaY);

        updatePositionsDOM();
      }

      function onMouseUp() {
        window.removeEventListener("mousemove", onMouseMove);
        window.removeEventListener("mouseup", onMouseUp);
        if (!hasMoved) {
          selectNode(n);
        }
        draggedNode = null;
      }

      window.addEventListener("mousemove", onMouseMove);
      window.addEventListener("mouseup", onMouseUp);
    });

    g.addEventListener("dblclick", (e) => {
      e.stopPropagation();
      if (n._children && n._children.length > 0) {
        toggleNode(n);
      }
    });

    nodesLayer.appendChild(g);
  });
}

function updatePositionsDOM() {
  const visibleNodes = nodes.filter(isVisible);

  // 1. Update node capsule positions
  visibleNodes.forEach(n => {
    const g = document.getElementById(`node-${n.id}`);
    if (g) {
      g.setAttribute("transform", `translate(${n.x}, ${n.y})`);
    }
  });

  // 2. Update curved movable links in real time
  links.forEach(l => {
    if (!isVisible(l.source) || !isVisible(l.target)) return;

    const path = document.getElementById(`link-${l.source.id}-${l.target.id}`);
    if (!path) return;

    const sx = l.source.x;
    const sy = l.source.y;
    const tx = l.target.x;
    const ty = l.target.y;

    // Organic S-curve Bezier
    const dx = tx - sx;
    const dy = ty - sy;
    const cx1 = sx + dx * 0.45;
    const cy1 = sy + dy * 0.1;
    const cx2 = sx + dx * 0.55;
    const cy2 = sy + dy * 0.9;

    path.setAttribute("d", `M ${sx} ${sy} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${tx} ${ty}`);
  });
}

buildDOMElements();
updatePositionsDOM();
setTimeout(fitView, 60);

// Node Selection & Details Drawer History
const navHistory = [];

function selectNode(n, recordHistory = true) {
  if (recordHistory && selectedNodeId && selectedNodeId !== n.id) {
    navHistory.push(selectedNodeId);
  }
  selectedNodeId = n.id;
  highlightSelectedNode();
  showDrawer(n);
  updateBackButton();
}

function goBack() {
  if (navHistory.length > 0) {
    const prevId = navHistory.pop();
    const prevNode = nodeMap.get(prevId);
    if (prevNode) {
      // Ensure ancestors of prevNode are expanded
      let p = prevNode.parent;
      let needsRebuild = false;
      while (p) {
        if (p.collapsed) {
          p.collapsed = false;
          needsRebuild = true;
        }
        p = p.parent;
      }
      if (needsRebuild) {
        resolveOverlaps(true);
        buildDOMElements();
        updatePositionsDOM();
      }
      selectNode(prevNode, false);
      focusNode(prevNode);
      return;
    }
  }

  // Fallback: If no history, navigate to parent if exists
  if (selectedNodeId) {
    const curr = nodeMap.get(selectedNodeId);
    if (curr && curr.parent) {
      selectNode(curr.parent, false);
      focusNode(curr.parent);
    }
  }
}

function updateBackButton() {
  const backBtn = document.getElementById("drawer-back");
  const barBackBtn = document.getElementById("bar-btn-back");
  const curr = selectedNodeId ? nodeMap.get(selectedNodeId) : null;
  const canGoBack = navHistory.length > 0 || (curr && curr.parent);

  [backBtn, barBackBtn].forEach(btn => {
    if (!btn) return;
    btn.disabled = !canGoBack;
    btn.style.opacity = canGoBack ? "1" : "0.35";
    btn.style.cursor = canGoBack ? "pointer" : "not-allowed";
    btn.style.pointerEvents = canGoBack ? "auto" : "none";
    if (navHistory.length > 0) {
      const prev = nodeMap.get(navHistory[navHistory.length - 1]);
      btn.setAttribute("title", prev ? `Back to "${prev.name}"` : "Back to Previous");
    } else if (curr && curr.parent) {
      btn.setAttribute("title", `Back to Parent "${curr.parent.name}"`);
    } else {
      btn.setAttribute("title", "No Previous Concept");
    }
  });
}

function highlightSelectedNode() {
  document.querySelectorAll(".node-capsule").forEach(r => r.classList.remove("selected"));
  document.querySelectorAll(".link-path").forEach(l => l.classList.remove("highlighted"));

  if (!selectedNodeId) return;

  const g = document.getElementById(`node-${selectedNodeId}`);
  if (g) {
    const cap = g.querySelector(".node-capsule");
    if (cap) cap.classList.add("selected");
  }

  // Highlight ancestor links up to root
  let curr = nodeMap.get(selectedNodeId);
  while (curr && curr.parent) {
    const lPath = document.getElementById(`link-${curr.parent.id}-${curr.id}`);
    if (lPath) lPath.classList.add("highlighted");
    curr = curr.parent;
  }
}

function toggleNode(n) {
  n.collapsed = !n.collapsed;
  resolveOverlaps(true);
  buildDOMElements();
  updatePositionsDOM();
  highlightSelectedNode();
}

function showDrawer(n) {
  const drawer = document.getElementById("details-drawer");
  const drawerBadge = document.getElementById("drawer-badge");
  const drawerTitle = document.getElementById("drawer-title");
  const drawerBody = document.getElementById("drawer-body");

  const theme = n.depth === 0 ? ROOT_THEME : DOMAIN_THEMES[n.domainIdx % DOMAIN_THEMES.length];
  const color = isLightTheme ? theme.lightStroke : theme.stroke;

  drawerBadge.style.background = isLightTheme ? "var(--btn-bg, #f5f5f0)" : "var(--btn-bg, #1e1f22)";
  drawerBadge.style.color = "var(--text-primary)";
  drawerBadge.style.borderColor = "var(--panel-border)";

  if (n.depth === 0) drawerBadge.textContent = "Root System Overview";
  else if (n.depth === 1) drawerBadge.textContent = `Domain ${n.domainIdx + 1} Architecture`;
  else if (n.depth === 2) drawerBadge.textContent = `Subtopic • Domain ${n.domainIdx + 1}`;
  else drawerBadge.textContent = "Deep Concept Disambiguation";

  drawerTitle.textContent = n.name;
  drawerTitle.style.color = "var(--text-primary)";

  let html = "";
  if (n.details) {
    html += `<div>${n.details}</div>`;
  } else {
    html += `<p style="color: var(--text-muted);">Explore child concepts or surrounding domain modules for specific architectural models and disambiguation matrices.</p>`;
  }

  // Clickable Subtopic / Concept Pills
  if (n._children && n._children.length > 0) {
    html += `<h3 style="margin-top: 20px; border-top: 1px solid var(--panel-border); padding-top: 14px;">Direct Subtopics & Concepts (${n._children.length}):</h3>`;
    html += `<div class="concept-pills">`;
    n._children.forEach(c => {
      html += `<div class="concept-pill" data-id="${c.id}">📍 ${c.name}</div>`;
    });
    html += `</div>`;
  }

  drawerBody.innerHTML = html;
  makeEmojisMonochrome(drawer);

  // Subtopic pill click listeners
  drawerBody.querySelectorAll(".concept-pill").forEach(pill => {
    pill.addEventListener("click", () => {
      const targetId = parseInt(pill.dataset.id, 10);
      const targetNode = nodeMap.get(targetId);
      if (targetNode) {
        if (n.collapsed) toggleNode(n);
        selectNode(targetNode);
        focusNode(targetNode);
      }
    });
  });

  drawer.classList.add("open");
  const overlay = document.getElementById("drawer-overlay");
  if (overlay) overlay.classList.add("active");
}

function closeDrawer() {
  const drawer = document.getElementById("details-drawer");
  const overlay = document.getElementById("drawer-overlay");
  if (drawer) drawer.classList.remove("open");
  if (overlay) overlay.classList.remove("active");
}

function focusNode(n) {
  transform.x = window.innerWidth / 2 - n.x * transform.k - 100;
  transform.y = window.innerHeight / 2 - n.y * transform.k;
  updateTransform();
}

const drawerBackBtn = document.getElementById("drawer-back");
if (drawerBackBtn) drawerBackBtn.addEventListener("click", goBack);

const barBackBtn = document.getElementById("bar-btn-back");
if (barBackBtn) barBackBtn.addEventListener("click", goBack);

document.getElementById("drawer-close").addEventListener("click", closeDrawer);

const drawerOverlay = document.getElementById("drawer-overlay");
if (drawerOverlay) {
  drawerOverlay.addEventListener("click", closeDrawer);
}

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeDrawer();
  } else if ((e.altKey && e.key === "ArrowLeft") || (e.key === "Backspace" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA")) {
    const drawer = document.getElementById("details-drawer");
    if (drawer && drawer.classList.contains("open")) {
      e.preventDefault();
      goBack();
    }
  }
});

document.getElementById("bar-btn-focus").addEventListener("click", () => {
  if (selectedNodeId) {
    const n = nodeMap.get(selectedNodeId);
    if (n) focusNode(n);
  }
});

document.getElementById("bar-btn-pin").addEventListener("click", () => {
  if (selectedNodeId) {
    const n = nodeMap.get(selectedNodeId);
    if (n) {
      n.isPinned = !n.isPinned;
      const pinBtn = document.getElementById("bar-btn-pin");
      pinBtn.classList.toggle("active", n.isPinned);
      pinBtn.setAttribute("title", n.isPinned ? "Node Pinned (Click to unpin)" : "Pin Node");
    }
  }
});

document.getElementById("bar-btn-copy").addEventListener("click", () => {
  if (selectedNodeId) {
    const n = nodeMap.get(selectedNodeId);
    if (n) {
      const text = `${n.name}

${n.details ? n.details.replace(/<[^>]+>/g, '') : ''}`;
      navigator.clipboard.writeText(text).then(() => {
        const copyIcon = document.getElementById("copy-icon");
        copyIcon.innerHTML = `<polyline points="20 6 9 17 4 12"></polyline>`;
        setTimeout(() => {
          copyIcon.innerHTML = `<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>`;
        }, 1500);
      });
    }
  }
});

// Fit View to Visible Nodes
function fitView() {
  const visibleNodes = nodes.filter(isVisible);
  if (visibleNodes.length === 0) return;

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  visibleNodes.forEach(n => {
    minX = Math.min(minX, n.x - n.width / 2);
    maxX = Math.max(maxX, n.x + n.width / 2);
    minY = Math.min(minY, n.y - n.height / 2);
    maxY = Math.max(maxY, n.y + n.height / 2);
  });

  const spanW = maxX - minX;
  const spanH = maxY - minY;
  const availW = window.innerWidth - 120;
  const availH = window.innerHeight - 120;

  const k = Math.min(availW / spanW, availH / spanH, 1.05);
  transform.k = Math.max(0.18, k);
  transform.x = window.innerWidth / 2 - ((minX + maxX) / 2) * transform.k - 40;
  transform.y = window.innerHeight / 2 - ((minY + maxY) / 2) * transform.k;
  updateTransform();
}

document.getElementById("btn-fit").addEventListener("click", fitView);

// Expand All
document.getElementById("btn-expand").addEventListener("click", () => {
  nodes.forEach(n => {
    n.collapsed = false;
  });
  resolveOverlaps(true);
  buildDOMElements();
  updatePositionsDOM();
  highlightSelectedNode();
  setTimeout(fitView, 50);
});

// Collapse to Domains
document.getElementById("btn-collapse").addEventListener("click", () => {
  nodes.forEach(n => {
    if (n.depth >= 1) n.collapsed = true;
  });
  resolveOverlaps(true);
  buildDOMElements();
  updatePositionsDOM();
  highlightSelectedNode();
  setTimeout(fitView, 50);
});

// Theme Switcher (Monochrome Sun/Moon Toggle)
const themeBtn = document.getElementById("btn-theme");
const themeIcon = document.getElementById("theme-icon");

function updateThemeIcon() {
  if (isLightTheme) {
    // Moon icon for switching back to dark
    themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
    themeBtn.setAttribute("title", "Switch to Dark Mode");
  } else {
    // Sun icon for switching to light
    themeIcon.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
    themeBtn.setAttribute("title", "Switch to Light Mode");
  }
}
updateThemeIcon();

themeBtn.addEventListener("click", () => {
  isLightTheme = !isLightTheme;
  document.body.classList.toggle("light-theme", isLightTheme);
  localStorage.setItem("hub_theme", isLightTheme ? "light" : "dark");
  localStorage.setItem("networks_theme", isLightTheme ? "light" : "dark");
  updateThemeIcon();
  buildDOMElements();
  updatePositionsDOM();
  highlightSelectedNode();
});

// Grid Visibility Toggle
const gridBtn = document.getElementById("btn-grid");
const gridPlane = document.getElementById("grid-plane");
gridBtn.addEventListener("click", () => {
  gridPlane.classList.toggle("hidden");
  gridBtn.classList.toggle("active", !gridPlane.classList.contains("hidden"));
});

// Reset Layout to Default Radial Grid
const resetBtn = document.getElementById("btn-reset");
if (resetBtn) {
  resetBtn.addEventListener("click", () => {
    nodes.forEach(n => {
      n.x = n.targetX;
      n.y = n.targetY;
    });
    resolveOverlaps(true);
    updatePositionsDOM();
    fitView();
  });
}

// Real-Time Search & Match Cycling
let matchedNodes = [];
let currentMatchIdx = -1;

const searchInput = document.getElementById("search-input");
const searchBadge = document.getElementById("search-badge");
const searchPrev = document.getElementById("search-prev");
const searchNext = document.getElementById("search-next");

searchInput.addEventListener("input", (e) => {
  const query = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".node-capsule").forEach(r => r.classList.remove("matched"));

  matchedNodes = [];
  currentMatchIdx = -1;

  if (!query) {
    searchBadge.style.display = "none";
    searchPrev.style.display = "none";
    searchNext.style.display = "none";
    return;
  }

  nodes.forEach(n => {
    const isMatch = n.name.toLowerCase().includes(query) || (n.details && n.details.toLowerCase().includes(query));
    if (isMatch) {
      matchedNodes.push(n);
      // Auto expand ancestors so match is rendered
      let curr = n.parent;
      while (curr) {
        curr.collapsed = false;
        curr = curr.parent;
      }
    }
  });

  buildDOMElements();
  highlightSelectedNode();

  if (matchedNodes.length > 0) {
    searchBadge.style.display = "inline-block";
    searchPrev.style.display = "inline-flex";
    searchNext.style.display = "inline-flex";
    currentMatchIdx = 0;
    updateSearchMatch();
  } else {
    searchBadge.style.display = "inline-block";
    searchBadge.textContent = "0";
    searchPrev.style.display = "none";
    searchNext.style.display = "none";
  }
});

function updateSearchMatch() {
  document.querySelectorAll(".node-capsule").forEach(r => r.classList.remove("matched"));
  searchBadge.textContent = `${currentMatchIdx + 1}/${matchedNodes.length}`;

  matchedNodes.forEach(mn => {
    const g = document.getElementById(`node-${mn.id}`);
    if (g) {
      const cap = g.querySelector(".node-capsule");
      if (cap) cap.classList.add("matched");
    }
  });

  const target = matchedNodes[currentMatchIdx];
  if (target) {
    focusNode(target);
    selectNode(target);
  }
}

searchNext.addEventListener("click", () => {
  if (matchedNodes.length > 0) {
    currentMatchIdx = (currentMatchIdx + 1) % matchedNodes.length;
    updateSearchMatch();
  }
});

searchPrev.addEventListener("click", () => {
  if (matchedNodes.length > 0) {
    currentMatchIdx = (currentMatchIdx - 1 + matchedNodes.length) % matchedNodes.length;
    updateSearchMatch();
  }
});

// Initial View Fit
setTimeout(() => {
  fitView();
  makeEmojisMonochrome(document.body);
}, 120);

// URL Search & Node Deep-linking
setTimeout(() => {
  try {
    const params = new URLSearchParams(window.location.search);
    const qSearch = params.get("search") || params.get("q") || params.get("topic") || params.get("node");
    if (qSearch && searchInput) {
      searchInput.value = decodeURIComponent(qSearch);
      searchInput.dispatchEvent(new Event("input"));
    }
  } catch (e) {
    console.error("URL search init error:", e);
  }
}, 250);

window.addEventListener("resize", () => {
  fitView();
});
</script>
