<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Graphics: Principles & Pipeline</title>
<style>
  :root {
    --bg-color: #121314;
    --canvas-bg: #121314;
    --grid-minor: rgba(255, 255, 255, 0.04);
    --grid-major: rgba(255, 255, 255, 0.09);
    --panel-bg: #1a1b1d;
    --panel-border: #555555;
    --text-primary: #f0f0ea;
    --text-secondary: #b0b0a8;
    --text-muted: #808078;
    --node-bg: #1a1b1d;
    --node-border: #555555;
    --link-color: rgba(160, 160, 160, 0.35);
    --link-pulse: #f0f0ea;
    --drawer-bg: #1a1b1d;
    --table-head-bg: #242528;
    --table-border: #555555;
    --table-stripe: #1e1f22;
    --btn-bg: #1e1f22;
    --btn-hover: #2a2b2f;
    --icon-color: #b0b0a8;
    --icon-hover: #f0f0ea;
    --font-serif: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", "Courier New", Courier, monospace;
  }

  body.light-theme {
    --bg-color: #f5f5f0;
    --canvas-bg: #f5f5f0;
    --grid-minor: rgba(0, 0, 0, 0.04);
    --grid-major: rgba(0, 0, 0, 0.09);
    --panel-bg: #ffffff;
    --panel-border: #111111;
    --text-primary: #111111;
    --text-secondary: #444444;
    --text-muted: #666666;
    --node-bg: #ffffff;
    --node-border: #111111;
    --link-color: rgba(60, 60, 60, 0.35);
    --link-pulse: #111111;
    --drawer-bg: #ffffff;
    --table-head-bg: #f5f5f0;
    --table-border: #111111;
    --table-stripe: #fafaf8;
    --btn-bg: #f9f9f6;
    --btn-hover: #eaeae4;
    --icon-color: #444444;
    --icon-hover: #111111;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0 !important;
  }

  ::selection {
    background: var(--text-primary);
    color: var(--panel-bg);
  }
  ::-moz-selection {
    background: var(--text-primary);
    color: var(--panel-bg);
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: var(--font-serif);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  #canvas-container {
    flex: 1;
    height: 100%;
    position: relative;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  #canvas-container:active { cursor: grabbing; }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Minimalist Graph Paper Grid */
  .grid-bg {
    transition: opacity 0.2s ease;
  }
  .grid-bg.hidden { opacity: 0; }

  /* Moving Organic Links */
  .link-path {
    fill: none;
    stroke: var(--link-color);
    stroke-width: 1.5px;
    stroke-linecap: square;
    transition: stroke 0.2s ease, stroke-width 0.2s ease;
  }
  .link-path.highlighted {
    stroke-width: 2.5px;
    stroke: var(--text-primary);
  }

  /* Draggable Node Pills / Wireframe Rectangles */
  .node-group {
    cursor: grab;
    transition: filter 0.15s ease;
    user-select: none;
    -webkit-user-select: none;
  }
  .node-group:active { cursor: grabbing; }

  .node-capsule {
    rx: 0px !important;
    ry: 0px !important;
    stroke-width: 1.5px;
    transition: stroke 0.2s ease, stroke-width 0.2s ease, filter 0.2s ease;
  }
  .node-capsule:hover {
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
  }
  body:not(.light-theme) .node-capsule:hover {
    filter: drop-shadow(0 4px 10px rgba(255, 255, 255, 0.25));
  }
  .node-capsule.selected {
    stroke-width: 2.5px !important;
    stroke: var(--text-primary) !important;
    filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.4)) !important;
  }
  body:not(.light-theme) .node-capsule.selected {
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4)) !important;
  }
  .node-capsule.matched {
    stroke: var(--text-primary) !important;
    stroke-width: 3px !important;
    stroke-dasharray: 4 2;
  }

  .node-label {
    font-size: 13px;
    font-weight: 500;
    fill: var(--text-primary);
    font-family: var(--font-serif);
    pointer-events: none;
    letter-spacing: 0.1px;
  }
  .node-label.root-label {
    font-size: 14.5px;
    font-weight: 700;
    font-style: italic;
    fill: var(--text-primary);
  }
  .node-label.domain-label {
    font-size: 13.5px;
    font-weight: 600;
  }

  .status-dot {
    pointer-events: none;
  }

  .badge-count {
    font-size: 11px;
    font-weight: 700;
    fill: #ffffff;
    font-family: var(--font-mono);
    pointer-events: none;
  }

  /* Minimalist Floating Toolbar with Pure Monochrome Icons */
  .toolbar {
    position: absolute;
    top: 16px;
    left: 20px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 2px 2px 0px var(--panel-border);
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 10px;
    border-right: 1px solid var(--panel-border);
    font-size: 13.5px;
    font-weight: 700;
    font-family: var(--font-serif);
    color: var(--text-primary);
    user-select: none;
    -webkit-user-select: none;
  }
  .live-dot {
    width: 7.5px;
    height: 7.5px;
    background: var(--text-primary);
    border-radius: 0 !important;
  }

  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap input {
    background: var(--btn-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-primary);
    font-family: var(--font-serif);
    border-radius: 0 !important;
    padding: 5px 10px 5px 28px;
    font-size: 12.5px;
    width: 190px;
    outline: none !important;
    transition: all 0.15s ease;
  }
  .search-wrap input:focus {
    width: 240px;
    border-color: var(--text-primary);
    background: var(--panel-bg);
  }
  .search-ico {
    position: absolute;
    left: 9px;
    display: flex;
    align-items: center;
    color: var(--icon-color);
    pointer-events: none;
  }

  .search-badge {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--panel-bg);
    background: var(--text-primary);
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    padding: 2px 7px;
    display: none;
    white-space: nowrap;
  }

  /* Monochrome Icon Buttons (No text!) */
  .mono-btn {
    background: var(--btn-bg);
    border: 1px solid var(--panel-border);
    color: var(--icon-color);
    border-radius: 0 !important;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s ease;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    outline: none !important;
  }
  .mono-btn svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    display: block;
  }
  .mono-btn:hover {
    background: var(--text-primary);
    color: var(--panel-bg);
    border-color: var(--text-primary);
  }
  .mono-btn.active {
    background: var(--text-primary) !important;
    color: var(--panel-bg) !important;
    border-color: var(--text-primary) !important;
  }

  /* Backdrop Overlay when Details Drawer is Open */
  .drawer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.48);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .drawer-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  body.light-theme .drawer-overlay {
    background: rgba(0, 0, 0, 0.25);
  }

  /* Sleek Slide-over Details Drawer */
  .details-drawer {
    width: 500px;
    max-width: 92vw;
    height: 100%;
    background: var(--drawer-bg);
    border-left: 2px solid var(--panel-border);
    border-radius: 0 !important;
    box-shadow: -10px 0 30px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 20;
    position: absolute;
    right: 0;
    top: 0;
  }
  .details-drawer.open {
    transform: translateX(0);
  }

  .drawer-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .drawer-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 0 !important;
    border: 1px solid var(--panel-border);
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-mono);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .drawer-title {
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-serif);
    line-height: 1.35;
    color: var(--text-primary);
  }

  .drawer-bar {
    padding: 8px 20px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    gap: 8px;
    background: var(--btn-bg);
  }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 22px;
    font-size: 14px;
    line-height: 1.65;
    font-family: var(--font-serif);
    color: var(--text-secondary);
  }
  .drawer-body h3 {
    color: var(--text-primary);
    margin: 16px 0 8px 0;
    font-size: 15px;
    font-weight: 700;
    font-family: var(--font-serif);
  }
  .drawer-body p { margin-bottom: 12px; }
  .drawer-body ul, .drawer-body ol { padding-left: 22px; margin-bottom: 12px; }
  .drawer-body li { margin-bottom: 6px; }
  .drawer-body strong { color: var(--text-primary); font-family: var(--font-serif); }
  .drawer-body em { font-style: italic; }
  .drawer-body code {
    background: var(--btn-bg);
    color: var(--text-primary);
    padding: 2px 6px;
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    font-family: var(--font-mono);
    font-size: 12px;
  }

  /* Clean Academic Tables */
  .drawer-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0 18px 0;
    font-size: 13px;
    border-radius: 0 !important;
    overflow: hidden;
    font-family: var(--font-serif);
    border: 1px solid var(--table-border);
  }
  .drawer-body th, .drawer-body td {
    padding: 8px 11px;
    border: 1px solid var(--table-border);
    text-align: left;
    vertical-align: top;
  }
  .drawer-body th {
    background: var(--table-head-bg);
    color: var(--text-primary);
    font-weight: 700;
  }
  .drawer-body tr:nth-child(even) { background: var(--table-stripe); }

  /* Concept Pills */
  .concept-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 10px 0 16px 0;
  }
  .concept-pill {
    background: var(--btn-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-secondary);
    font-family: var(--font-serif);
    border-radius: 0 !important;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.1s ease;
  }
  .concept-pill:hover {
    background: var(--text-primary);
    color: var(--panel-bg);
    border-color: var(--text-primary);
  }

  /* Minimalist Footer Hint */
  .hint-pill {
    position: absolute;
    bottom: 16px;
    left: 20px;
    font-size: 12px;
    font-family: var(--font-serif);
    color: var(--text-muted);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 0 !important;
    padding: 4px 12px;
    pointer-events: none;
    box-shadow: 2px 2px 0px var(--panel-border);
  }

  /* Robust Drawer Theme Adaptations */
  body.light-theme .drawer-body div[style*="background"] {
    background: var(--btn-bg) !important;
    border-color: var(--panel-border) !important;
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body span[style*="color:#38bdf8"],
  body.light-theme .drawer-body p[style*="color:#38bdf8"],
  body.light-theme .drawer-body a[style*="color:#38bdf8"] {
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body p[style*="color:#cbd5e1"],
  body.light-theme .drawer-body ul[style*="color:#94a3b8"] {
    color: var(--text-secondary) !important;
  }
  body.light-theme .drawer-body tr[style*="background:#1e293b"] {
    background: var(--table-head-bg) !important;
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body tr[style*="background:#1e293b"] th {
    color: var(--text-primary) !important;
  }
  body.light-theme .drawer-body tr[style*="background:#0f172a"] {
    background: var(--table-stripe) !important;
  }
  body.light-theme .drawer-body a[style*="background"] {
    background: var(--text-primary) !important;
    color: var(--panel-bg) !important;
    border: 1px solid var(--panel-border) !important;
  }

  /* Retro Monochrome Emojis */
  .mono-emoji {
    display: inline-block;
    vertical-align: -0.1em;
    line-height: 1;
    filter: grayscale(100%) brightness(0.65) contrast(160%);
    -webkit-filter: grayscale(100%) brightness(0.65) contrast(160%);
    transition: filter 0.1s ease;
  }
  body:not(.light-theme) .mono-emoji {
    filter: grayscale(100%) brightness(1.75) contrast(140%);
    -webkit-filter: grayscale(100%) brightness(1.75) contrast(140%);
  }
  body.light-theme .drawer-body a[style*="background"] .mono-emoji,
  body.light-theme .btn:hover .mono-emoji,
  body.light-theme button:hover .mono-emoji {
    filter: grayscale(100%) brightness(2.2) contrast(150%) !important;
    -webkit-filter: grayscale(100%) brightness(2.2) contrast(150%) !important;
  }
</style>
</head>
<body>

<div id="canvas-container">
  <div class="toolbar">
    <div class="brand">
      <div class="live-dot"></div>
      <span>Computer Graphics: Principles & Pipeline</span>
    </div>

    <div class="search-wrap">
      <span class="search-ico">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input type="text" id="search-input" placeholder="Search concepts (Tahoe, Karn, AIMD)...">
    </div>
    <span class="search-badge" id="search-badge">0</span>

    <!-- Search Prev/Next (Monochrome Icons) -->
    <button class="mono-btn" id="search-prev" style="display:none;" title="Previous Match">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <button class="mono-btn" id="search-next" style="display:none;" title="Next Match">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>

    <!-- Theme Switcher (Monochrome Sun/Moon Icon) -->
    <button class="mono-btn" id="btn-theme" title="Toggle Light / Dark Mode">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>

    <!-- Grid Toggle (Monochrome Grid Icon) -->
    <button class="mono-btn active" id="btn-grid" title="Toggle Graph Paper Grid">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
    </button>

    <!-- Reset Layout (Monochrome Reset Icon) -->
    <button class="mono-btn" id="btn-reset" title="Reset Layout to Default Radial Grid">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
    </button>

    <!-- Fit View (Monochrome Crosshairs / Fit Icon) -->
    <button class="mono-btn" id="btn-fit" title="Zoom to Fit">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><polyline points="21 15 21 21 15 21"></polyline><polyline points="3 9 3 3 9 3"></polyline></svg>
    </button>

    <!-- Expand All (Monochrome Tree Expand Icon) -->
    <button class="mono-btn" id="btn-expand" title="Expand All Branches">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
    </button>

    <!-- Collapse All (Monochrome Tree Fold Icon) -->
    <button class="mono-btn" id="btn-collapse" title="Collapse to Domains">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
    </button>
  </div>

  <svg id="svg-canvas">
    <defs>
      <!-- Engineering Graph Paper Grid -->
      <pattern id="grid-pattern-minor" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--grid-minor)" stroke-width="0.75" />
      </pattern>
      <pattern id="grid-pattern-major" width="120" height="120" patternUnits="userSpaceOnUse">
        <rect width="120" height="120" fill="url(#grid-pattern-minor)" />
        <path d="M 120 0 L 0 0 0 120" fill="none" stroke="var(--grid-major)" stroke-width="1.2" />
      </pattern>
    </defs>

    <g id="viewport">
      <!-- Infinite Graph Paper Grid Plane -->
      <rect id="grid-plane" class="grid-bg" x="-10000" y="-10000" width="20000" height="20000" fill="url(#grid-pattern-major)" />

      <!-- Moving Links Layer -->
      <g id="links-layer"></g>

      <!-- Movable Nodes Layer -->
      <g id="nodes-layer"></g>
    </g>
  </svg>

  <div class="hint-pill">
    Drag nodes to reposition • Scroll to zoom • Click +/- to toggle branch • Click node for details
  </div>
</div>

<!-- Backdrop Overlay for Details Drawer -->
<div class="drawer-overlay" id="drawer-overlay"></div>

<div class="details-drawer" id="details-drawer">
  <div class="drawer-head">
    <div style="display: flex; align-items: flex-start; gap: 10px; flex: 1;">
      <!-- Monochrome Back Button -->
      <button class="mono-btn" id="drawer-back" title="Go Back to Previous Concept" disabled style="margin-top: 2px; flex-shrink: 0; opacity: 0.35; cursor: not-allowed; pointer-events: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <div style="flex: 1; min-width: 0;">
        <div class="drawer-badge" id="drawer-badge">Overview</div>
        <div class="drawer-title" id="drawer-title">Node Title</div>
      </div>
    </div>
    <!-- Monochrome Close Button -->
    <button class="mono-btn" id="drawer-close" title="Close Panel" style="flex-shrink: 0;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  <div class="drawer-bar">
    <!-- Monochrome Back Button in Action Bar -->
    <button class="mono-btn" id="bar-btn-back" title="Go Back to Previous Concept" disabled style="opacity: 0.35; cursor: not-allowed; pointer-events: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <!-- Monochrome Center/Focus Button -->
    <button class="mono-btn" id="bar-btn-focus" title="Center in View">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line></svg>

ls": "\n        <h4>Exam Pattern: How does a CRT monitor display color pictures? Briefly explain.</h4>\n        <div style=\"margin: 8px 0; padding: 10px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n          <p style=\"font-size:12px; color:var(--text-ink, #f0f0ea); font-weight:bold; margin-bottom:4px; font-family:var(--font-mono, monospace);\">\n            <span class=\"mono-emoji\">⭐</span> Exam Weight: 2 Times Asked · 7 Total Marks\n          </p>\n          <p style=\"font-size:12px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n            <strong>Recent Sessions:</strong> 2020, 2021\n          </p>\n          <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:10px;\">\n            <li style='margin-bottom:5px;'><strong>(2021)</strong> [7M] <em>How does a CRT monitor display color pictures? Briefly explain....</em></li><li style='margin-bottom:5px;'><strong>(2020)</strong>  <em>How does a CRT monitor display color pictures? Briefly explain....</em></li>\n          </ul>\n          <a href=\"../question-browser/computer-graphics-masudul-sir.html?search=How%20does%20a%20CRT%20monitor%20display\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:6px 12px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11.5px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n            <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n          </a>\n        </div>\n        "}]}, {"name": "1. Hardware Architecture & Raster Foundations", "details": "\n                <h3>Graphics Hardware & Raster Display Architecture</h3>\n                <p>Displays synthesize continuous geometric models into discrete raster pixel arrays. The refresh subsystem continuously reads frame buffer memory to maintain display stability.</p>\n                <table style=\"width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                  <tr style=\"background:#1e293b; color:#38bdf8;\">\n                    <th style=\"padding:6px; border:1px solid #334155;\">Component</th>\n                    <th style=\"padding:6px; border:1px solid #334155;\">Raster Display</th>\n                    <th style=\"padding:6px; border:1px solid #334155;\">Vector / Random-Scan Display</th>\n                  </tr>\n                  <tr>\n                    <td style=\"padding:6px; border:1px solid #334155;\"><strong>Beam Deflection</strong></td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Predefined raster scanlines (top to bottom, left to right).</td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Direct electron beam deflection along line segments.</td>\n                  </tr>\n                  <tr style=\"background:#0f172a;\">\n                    <td style=\"padding:6px; border:1px solid #334155;\"><strong>Memory Model</strong></td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Dedicated Frame Buffer stores discrete intensity bitplanes.</td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Display buffer stores line drawing commands (display list).</td>\n                  </tr>\n                  <tr>\n                    <td style=\"padding:6px; border:1px solid #334155;\"><strong>Flicker & Capacity</strong></td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Constant refresh time (independent of scene complexity).</td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Refresh rate drops as primitive count increases.</td>\n                  </tr>\n                </table>\n                \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">HIGH PRIORITY · 47x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 47 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>Transform Trianglel to Triange2 in the following figure by a sequence of basic (14) transformations.</em></li><li><em>Proof that 3D rotation matrix can be writtcn as (18)  R = Icos9+ sine U + (I — cos O)uuT, where u is</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-graphics-masudul-sir.html?search=Geometric\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            ", "children": [{"name": "Frame Buffer Sizing & Bit Depth", "details": "\n                        <h4>Frame Buffer Memory Formulation</h4>\n                        <p>Total memory required to store a raster image of resolution $W \\times H$ with color depth $b$ bits/pixel:</p>\n                        <p style=\"text-align:center; font-weight:bold; margin:8px 0;\">$$\\text{Size (Bytes)} = \\frac{W \\times H \\times b}{8}$$</p>\n                        <p>For TrueColor ($24$ bits, $16.7$ million colors at $1920 \\times 1080$), memory requirement is $1920 \\times 1080 \\times 3 = 6.22\\text{ MB}$ per frame.</p>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">MEDIUM PRIORITY · 17x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 17 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>How is painting priority ofa surface determined by painter's algorithm?</em></li><li><em>Explain depth-buffer algorithm in details for visible surface detection. What are the (11) advantage</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-graphics-masudul-sir.html?search=Visibility\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            "}, {"name": "Color Lookup Tables (LUT)", "details": "\n                        <h4>Palette-Based Color Lookup Architecture</h4>\n                        <p>Instead of storing full 24-bit values per pixel, frame buffer pixels store an index into a color table ($2^k$ entries of $w$ bits each). Reduces frame buffer memory while allowing rapid color palette swapping.</p>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">WATCHLIST · 6x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 6 subquestions across 4 exam sessions (2015, 2016, 2017, 2019).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>Write about the differences between Object-space method and Image-space method.</em></li><li><em>How do you convert RGB color space into HSI color space? Explain briefly with appropriate (12) figur</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-graphics-masudul-sir.html?search=Color\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            "}]}, {"name": "2. 2D Affine Transformations", "details": "\n                <h3>2D Geometric Transformations & Homogeneous Coordinates</h3>\n                <p>Affine transformations preserve points, straight lines, and planes. Parallel lines remain parallel after an affine transform.</p>\n                <div style=\"margin-top: 8px; padding: 8px; background: rgba(56, 189, 248, 0.08); border-left: 2px solid #38bdf8;\">\n                  <strong>Homogeneous Coordinates:</strong> Embedding $(x, y) \\in \\mathbb{R}^2$ into $(x, y, 1)^T \\in \\mathbb{P}^2$ unifies translation, rotation, scaling, and shear into matrix multiplications.\n                </div>\n                \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">HIGH PRIORITY · 47x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 47 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>Transform Trianglel to Triange2 in the following figure by a sequence of basic (14) transformations.</em></li><li><em>Proof that 3D rotation matrix can be writtcn as (18)  R = Icos9+ sine U + (I — cos O)uuT, where u is</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-graphics-masudul-sir.html?search=Geometric\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            ", "children": [{"name": "Fundamental 2D Transformation Matrices", "details": "\n                        <h4>Elementary 2D Matrices</h4>\n                        <ul>\n                          <li><strong>Translation:</strong> $\\begin{bmatrix} 1 & 0 & t_x \\\\ 0 & 1 & t_y \\\\ 0 & 0 & 1 \\end{bmatrix}$</li>\n                          <li><strong>Rotation:</strong> $\\begin{bmatrix} \\cos\\theta & -\\sin\\theta & 0 \\\\ \\sin\\theta & \\cos\\theta & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$</li>\n                          <li><strong>Scaling:</strong> $\\begin{bmatrix} s_x & 0 & 0 \\\\ 0 & s_y & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$</li>\n                          <li><strong>Shear:</strong> $\\begin{bmatrix} 1 & sh_x & 0 \\\\ sh_y & 1 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$</li>\n                        </ul>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">WATCHLIST · 6x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 6 subquestions across 4 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>Neatly write shooting algorithm 10 compute radiosity ofa patch. Why does it converge (l C) faster th</em></li><li><em>Use Gauss-Seidal iterative approach of solving radiosity equation to find the radiosities (20)  of e</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-graphics-masudul-sir.html?search=Radiosity\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            "}, {"name": "Composite Transformations & Non-Commutativity", "details": "\n                        <h4>Matrix Ordering & Pivot Point Rotation</h4>\n                        <p>Matrix multiplication is non-commutative: $M_1 M_2 \\ne M_2 M_1$. Rotation followed by translation is distinct from translation followed by rotation.</p>\n                        <p><strong>Arbitrary Pivot Point $(x_r, y_r)$:</strong></p>\n                        <p style=\"text-align:center;\">$$M = T(x_r, y_r) \\cdot R(\\theta) \\cdot T(-x_r, -y_r)$$</p>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">HIGH PRIORITY · 47x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 47 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>Transform Trianglel to Triange2 in the following figure by a sequence of basic (14) transformations.</em></li><li><em>Proof that 3D rotation matrix can be writtcn as (18)  R = Icos9+ sine U + (I — cos O)uuT, where u is</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-graphics-masudul-sir.html?search=Geometric\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            "}]}, {"name": "3. 3D Geometric Transformations", "details": "\n                <h3>3D Transformations & Arbitrary Axis Rotation</h3>\n                <p>Extends 2D principles to $\\mathbb{R}^3$ using $4 \\times 4$ homogeneous matrices. Right-handed coordinate system standard: thumb along $+Z$, fingers curl from $+X$ to $+Y$.</p>\n                \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                < lically leaves $y$ unchanged ($z' = z\\cos\\theta - x\\sin\\theta, x' = z\\sin\\theta + x\\cos\\theta$). Note sign convention!</li>\n                        </ul>\n                        "}, {"name": "Arbitrary 3D Axis Rotation Pipeline", "details": "\n                        <h4>5-Step Arbitrary Axis Rotation</h4>\n                        <ol style=\"margin-left:16px;\">\n                          <li><strong>Translate:</strong> Move arbitrary axis passing through $P_0(x_0, y_0, z_0)$ to origin via $T(-x_0, -y_0, -z_0)$.</li>\n                          <li><strong>Rotate around X:</strong> Align projection of direction vector with $Z$ axis via $R_x(\\alpha)$.</li>\n                          <li><strong>Rotate around Y:</strong> Align axis directly with $+Z$ axis via $R_y(\\beta)$.</li>\n                          <li><strong>Rotate:</strong> Perform desired rotation $R_z(\\theta)$ about $+Z$.</li>\n                          <li><strong>Invert Alignments:</strong> $R_y(-\beta) \\cdot R_x(-\u0007lpha) \\cdot T(x_0, y_0, z_0)$.</li>\n                        </ol>\n                        <p style=\"margin-top:6px; font-weight:bold;\">$$M_{total} = T^{-1} R_x^{-1} R_y^{-1} R_z(\\theta) R_y R_x T$$</p>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mon _L (N \\cdot L) = k_d I_L \\cos\\theta$$</p>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">MEDIUM PRIORITY · 13x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 13 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>State how Ward illuinination estimates anisotropic specular rcflcction.</em></li><li><em>A point P(l, 2, 3) lies on a surlhce with normal N (O, 0, 1), viewer is at (1, 2, A (08) fC021 monoc</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-graphics-masudul-sir.html?search=Illumination\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            "}, {"name": "Phong & Blinn-Phong Specular Model", "details": "\n                        <h4>Specular Highlights & Halfway Vector</h4>\n                        <table style=\"width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                          <tr style=\"background:#1e293b; color:#38bdf8;\">\n                            <th style=\"padding:6px; border:1px solid #334155;\">Model</th>\n                            <th style=\"padding:6px; border:1px solid #334155;\">Formulation</th>\n                            <th style=\"padding:6px; border:1px solid #334155;\">Computational Advantage</th>\n                          </tr>\n                          <tr>\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>Phong</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">$I_s = k_s I_L (R \\cdot V)^n$</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Requires calculating reflection vector $R = 2(N \\cdot L)N - L$ per pixel.</td>\n                          </tr>\n                          <tr style=\"background:#0f172a;\">\n                            <td style=\"padding:6px; border:1px solid #334155;\"><strong>Blinn-Phong</strong></td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">$I_s = k_s I_L (N \\cdot H)^n$</td>\n                            <td style=\"padding:6px; border:1px solid #334155;\">Uses halfway vector $H = \\frac{L + V}{\\|L + V\\|}$. For directional light/viewer, $H$ is constant across the polygon!</td>\n                          </tr>\n                        </table>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">MEDIUM PRIORITY · 17x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 17 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>When performing Cohen-Sutherland line clipping, how do we use outcodes to check for trivial rejectio</em></li><li><em>A graphics system renders two line segments: LI (—1, 7) to (11, I) and L2 (5,4) to (13) j (9, 12). '</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-graphics-masudul-sir.html?search=Line\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            "}, {"name": "Cook-Torrance Microfacet PBR Model", "details": "\n                        <h4>Physically Based Reflectance (D, G, F)</h4>\n                        <p>Models rough surfaces as tiny ideal specular microfacets:</p>\n                        <p style=\"text-align:center;\">$$f_r = \\frac{D \\cdot G \\cdot F}{4(N \\cdot L)(N \\cdot V)}$$</p>\n                        <ul>\n                          <li><strong>$D$ (Distribution):</strong> Fraction of microfacets aligned with $H$ (Beckmann / GGX).</li>\n                          <li><strong>$G$ (Geometric Attenuation):</strong> Self-shadowing and masking of microfacets.</li>\n                          <li><strong>$F$ (Fresnel Reflectance):</strong> Fraction of reflected light as angle of incidence approaches grazing angle (Schlick's approximation).</li>\n                        </ul>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">HIGH PRIORITY · 47x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 47 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>Transform Trianglel to Triange2 in the following figure by a sequence of basic (14) transformations.</em></li><li><em>Proof that 3D rotation matrix can be writtcn as (18)  R = Icos9+ sine U + (I — cos O)uuT, where u is</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-graphics-masudul-sir.html?search=Geometric\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            "}]}, {"name": "10. Polygon Shading Models", "details": "\n                <h3>Shading: Flat vs Gouraud vs Phong Interpolation</h3>\n                <p>Determines how local illumination equations are evaluated across polygonal meshes.</p>\n                <table style=\"width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;\">\n                  <tr style=\"background:#1e293b; color:#38bdf8;\">\n                    <th style=\"padding:6px; border:1px solid #334155;\">Feature</th>\n                    <th style=\"padding:6px; border:1px solid #334155;\">Flat Shading</th>\n                    <th style=\"padding:6px; border:1px solid #334155;\">Gouraud Shading</th>\n                    <th style=\"padding:6px; border:1px solid #334155;\">Phong Shading</th>\n                  </tr>\n                  <tr>\n                    <td style=\"padding:6px; border:1px solid #334155;\"><strong>Interpolated Entity</strong></td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">None (one normal per face).</td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Color intensities at vertices interpolated across polygon.</td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Normal vectors interpolated; lighting computed per pixel.</td>\n                  </tr>\n                  <tr style=\"background:#0f172a;\">\n                    <td style=\"padding:6px; border:1px solid #334155;\"><strong>Highlights & Artifacts</strong></td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Faceted appearance; Mach banding at edges.</td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Smooth appearance; misses specular highlights inside faces.</td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Accurate specular highlights; eliminates Mach banding.</td>\n                  </tr>\n                  <tr>\n                    <td style=\"padding:6px; border:1px solid #334155;\"><strong>Computational Cost</strong></td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Minimal (1 lighting calc per polygon).</td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">Low (1 calc per vertex + linear interpolation).</td>\n                    <td style=\"padding:6px; border:1px solid #334155;\">High (normal re-normalization + lighting per pixel).</td>\n                  </tr>\n                </table>\n                \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">HIGH PRIORITY · 26x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 26 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>What are the major side effects of scan conversion? Explain.</em></li><li><em>How can you generate the terrain in computer graphics? Explain.</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-graphics-masudul-sir.html?search=Line,\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); border:1px solid var(--border-main, #555555); text-decoration:none; border-radius:0 !important; font-size:11px; font-weight:bold; font-family:var(--font-mono, monospace);\">\n                <span class=\"mono-emoji\">🔍</span> [VIEW QUESTIONS IN BROWSER &rarr;]\n              </a>\n            </div>\n            ", "children": [{"name": "Mach Banding & Perspective-Correct Interpolation", "details": "\n                        <h4>Perceptual & Geometric Shading Flaws</h4>\n                        <ul>\n                          <li><strong>Mach Bands:</strong> Human eye's lateral inhibition exaggerates intensity discontinuities at polygon edges in flat and Gouraud shading.</li>\n                          <li><strong>Perspective-Correct Interpolation:</strong> Linear screen-space interpolation causes texture and normal distortion. Attributes must be interpolated as $B/z$ and divided by $1/z$.</li>\n                        </ul>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-rad                       <pre style=\"background:#0f172a; padding:6px; border-radius:4px; font-size:11px;\">\nif (z < DepthBuffer[x, y]) {\n    DepthBuffer[x, y] = z;\n    ColorBuffer[x, y] = polygon_color;\n}\n                        </pre>\n                        <p><strong>Complexity:</strong> $O(N \\times P)$ where $N$ is polygon count, $P$ is average pixel raster area. Memory overhead: requires dedicated hardware depth memory.</p>\n                        \n            <div style=\"margin-top: 14px; padding: 10px 12px; background: var(--bg-box, #202225); border: 1px solid var(--border-main, #555555); border-radius: 0 !important;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n                <span style=\"font-size:12px; font-weight:bold; color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\"><span class=\"mono-emoji\">📝</span> Past University Exam Weight</span>\n                <span style=\"font-size:10px; font-weight:bold; padding:2px 8px; border-radius:0 !important; border:1px solid var(--border-main, #555555); background:var(--bg-sheet, #18191b); color:var(--text-ink, #f0f0ea); font-family:var(--font-mono, monospace);\">MEDIUM PRIORITY · 17x Asked</span>\n              </div>\n              <p style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-bottom:6px;\">\n                <strong>Recurrence:</strong> 17 subquestions across 10 exam sessions (2021, 2022, 2023, 2024).\n              </p>\n              <ul style=\"font-size:11.5px; color:var(--text-dim, #b8b8b0); margin-left:14px; margin-bottom:8px;\">\n                <li><em>When performing Cohen-Sutherland line clipping, how do we use outcodes to check for trivial rejectio</em></li><li><em>A graphics system renders two line segments: LI (—1, 7) to (11, I) and L2 (5,4) to (13) j (9, 12). '</em></li>\n              </ul>\n              <a href=\"../question-browser/computer-graphics-masudul-sir.html?sear
